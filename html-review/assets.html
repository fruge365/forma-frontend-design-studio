<body data-review-context="list">
<header class="brandbar"><div class="bar-inner"><div class="brand"><span class="glyph" aria-hidden="true"><i></i><i></i><i></i></span><b>北线</b><span class="product">厂务运维</span></div><span class="shift">早班　<span class="mono">08:00–16:00</span></span></div></header>
<main class="shell"><div class="head"><h1>设备巡检台账</h1><p>按区域和巡检状态查找设备，核对后加入本班复核清单。</p></div>
<p class="feedback" id="message" role="status" aria-live="polite"></p>
<section id="list-view">
<nav class="tabs" aria-label="台账范围"><button class="tab" id="tab-ledger" data-review-id="assets-ledger" aria-pressed="true">全部设备 <b id="ledger-count"></b></button><button class="tab" id="tab-queue" data-review-id="assets-queue" aria-pressed="false">本班清单 <b id="queue-count"></b></button></nav>
<div class="undo-bar" id="undo-bar" hidden><span id="undo-description"></span><button class="textbtn" id="undo-batch" data-review-id="assets-undo">撤销此次加入</button></div>
<div class="board">
<div class="tools"><form id="filters" class="filters" aria-label="查询设备"><div class="search"><label for="query">搜索设备</label><div class="combo"><input type="search" id="query" name="q" placeholder="设备名称或编号" maxlength="80"><button class="go" id="find" type="submit" data-review-id="assets-search">查找</button></div></div><div><label for="area">所在区域</label><select id="area" data-review-id="assets-area"></select></div><div><label for="status">巡检状态</label><select id="status" data-review-id="assets-status"></select></div><div class="sort"><label for="sort">排序</label><select id="sort"><option value="id">设备编号升序</option><option value="time">巡检时刻优先</option></select></div></form>
<div class="chips" id="chips" aria-label="已应用条件"></div></div>
<div class="scope" id="scope"><div class="scope-controls"><label class="selectall"><input type="checkbox" id="page-select" data-review-id="assets-select-page">选本页</label><button id="select-all" class="textbtn" data-review-id="assets-select-all">选全部结果</button><span class="scope-detail" id="selected-count"></span><button id="clear-selection" class="textbtn" hidden>取消勾选</button></div><button class="primary" id="preview-batch" data-review-id="assets-preview" disabled>核对所选设备</button></div>
<table aria-label="设备巡检结果" id="table"><thead><tr><th scope="col"><span class="screenonly">选择</span></th><th scope="col">设备 / 编号</th><th scope="col">所在区域</th><th scope="col">巡检状态</th><th scope="col">计划巡检</th><th scope="col">本班复核</th></tr></thead><tbody id="rows"></tbody></table>
<section class="empty" id="empty" hidden></section>
<div class="paging"><span id="range"></span><div class="nav-btns"><button id="prev" aria-label="上一页">上一页</button><span id="pages" class="mono"></span><button id="next-page" aria-label="下一页">下一页</button></div></div></div></section>
<section id="detail-view" hidden><button id="detail-back" data-review-id="assets-detail-back" class="textbtn backlink">← 返回设备列表</button><article class="sheet" id="detail-content"></article></section>
<section id="batch-view" hidden><button id="batch-back" class="textbtn backlink">← 返回勾选</button><article class="sheet" id="batch-content"></article></section>
<footer class="foot"><span>虚构设备与班次 · 清单保存在当前浏览器</span><span>交班日 <time datetime="2026-11-09">2026.11.09</time></span></footer>
</main>
<script>
'use strict';
const areas=['动力站','装配区','仓储区'];
const statuses={due:'待复核',flag:'记录有异',done:'已完成',service:'停机检修'};
const reasons={done:'已完成本轮巡检',service:'检修中暂不纳入'};
const data=[
  ['循环水泵 A','动力站','flag','08:30','陈路','泵组回流段','上次记录缺少出口压力，需补抄读数。'],
  ['装配线排风机','装配区','due','09:10','孙杭','二线北侧','轮值复核风机皮带张力。'],
  ['货梯门机','仓储区','service','09:30','李禾','一号货梯','检修班正更换门机皮带。'],
  ['冷却塔补水阀','动力站','done','08:15','陈路','塔区西侧','已核对阀位并登记。'],
  ['扭矩测试台','装配区','due','10:00','孙杭','精装工位','本班抽查扭矩记录。'],
  ['稳压水泵 B','动力站','due','08:45','周原','泵房二层','检查稳压回路与压力表。'],
  ['库区送风机','仓储区','flag','09:25','李禾','东库通道','两次风量登记单位不一致。'],
  ['输送带驱动机','装配区','done','10:20','方宁','三线末端','已复核传动罩紧固状态。'],
  ['空压机一号','动力站','service','11:20','周原','空压间','冷却器正在拆检。'],
  ['月台升降板','仓储区','due','09:00','方宁','二号月台','本班检查限位开关。'],
  ['冷凝水回收泵','动力站','flag','10:25','陈路','回收罐北侧','前后两张记录的流量单位待核。'],
  ['影像检测台','装配区','due','11:05','孙杭','质检工位','抽查相机标定记录。'],
  ['库门缓冲器','仓储区','done','08:50','李禾','北库门口','已完成回弹检查。'],
  ['精密注油器','装配区','due','10:50','方宁','一线南侧','核对供油间隔设置。'],
  ['备用水泵 C','动力站','done','09:40','周原','备用泵间','切换记录已复核。']
].map(([name,area,status,time,owner,location,note],i)=>({id:'NL-'+(101+i),name,area,status,time,owner,location,note}));
const byId=new Map(data.map(row=>[row.id,row]));
const $=id=>document.getElementById(id);
const pageSize=5;
const prefix='forma-inspection/v1:'+new URL('.',location.href).pathname;
const selected=new Set();
let book={queue:[],lastBatch:[]},pending=null,needsReview=false,busy=false,storageError=false;
function readBook(){
  const raw=localStorage.getItem(prefix);
  if(raw===null)return {queue:[],lastBatch:[]};
  const value=JSON.parse(raw);
  if(!value||!Array.isArray(value.queue)||!Array.isArray(value.lastBatch))throw Error('Invalid queue');
  return {queue:[...new Set(value.queue.filter(id=>byId.has(id)))],lastBatch:[...new Set(value.lastBatch.filter(id=>value.queue.includes(id)&&byId.has(id)))]};
}
try{book=readBook()}catch{storageError=true}
function message(value){$('message').textContent=value}
function readRoute(){
  const params=new URL(location.href).searchParams;
  const page=Number(params.get('p'));
  return {view:params.get('tab')==='queue'?'queue':'ledger',q:(params.get('q')||'').trim().slice(0,80),area:areas.includes(params.get('area'))?params.get('area'):'',status:Object.hasOwn(statuses,params.get('status'))?params.get('status'):'',sort:params.get('sort')==='time'?'time':'id',page:Number.isSafeInteger(page)&&page>0?page:1,asset:byId.has(params.get('asset'))?params.get('asset'):''};
}
let state=readRoute();
if('scrollRestoration' in history)history.scrollRestoration='manual';
function writeRoute(mode='replaceState',extra={}){
  if(location.protocol==='file:')return;
  const url=new URL(location.href);
  for(const [k,v] of Object.entries({tab:state.view==='queue'?'queue':'',q:state.q,area:state.area,status:state.status,sort:state.sort==='time'?'time':'',p:state.page>1?String(state.page):'',asset:state.asset})){
    if(v)url.searchParams.set(k,v);else url.searchParams.delete(k);
  }
  history[mode](extra,'',url);
}
function rows(filter=state){
  const term=filter.q.trim().toLocaleLowerCase();
  return data.filter(row=>(filter.view!=='queue'||book.queue.includes(row.id))&&(!filter.area||row.area===filter.area)&&(!filter.status||row.status===filter.status)&&(!term||(row.name+' '+row.id).toLocaleLowerCase().includes(term)))
    .sort((a,b)=>(filter.sort==='time'?a.time.localeCompare(b.time):0)||a.id.localeCompare(b.id));
}
function pageSlice(all){return all.slice((state.page-1)*pageSize,state.page*pageSize)}
function reason(id,source=book){return source.queue.includes(id)?'已在本班清单':reasons[byId.get(id).status]||''}
function availability(id){const blocked=reason(id);return blocked||'可加入'}
function pill(row){return '<span class="pill '+row.status+'">'+statuses[row.status]+'</span>'}
function setContext(context){
  document.body.dataset.reviewContext=context;
  if(context==='detail')document.body.dataset.reviewObject=state.asset;else delete document.body.dataset.reviewObject;
  $('list-view').hidden=context!=='list';$('detail-view').hidden=context!=='detail';$('batch-view').hidden=context!=='batch';
}
function focus(id){const node=$(id);if(node)node.focus({preventScroll:true})}
function drawChips(){
  $('chips').replaceChildren();
  for(const [key,label,value] of [['q','搜索',state.q],['area','区域',state.area],['status','状态',statuses[state.status]]]){
    if(!value)continue;
    const chip=document.createElement('button');chip.className='chip';chip.type='button';chip.textContent=label+' · '+value+' ×';chip.setAttribute('aria-label','移除'+label+'条件 '+value);
    chip.onclick=()=>{apply({[key]:''});focus(key==='q'?'query':key)};
    $('chips').append(chip);
  }
}
function describeScope(all,visible){
  const checked=visible.filter(row=>selected.has(row.id)).length;
  $('page-select').checked=visible.length>0&&checked===visible.length;
  $('page-select').disabled=!visible.length;
  $('page-select').indeterminate=checked>0&&checked<visible.length;
  $('select-all').hidden=all.length<=visible.length;
  $('select-all').textContent='选全部 '+all.length+' 个结果';
  $('selected-count').textContent=selected.size?'跨页已选 '+selected.size+' 台，其中本页 '+checked+' 台':'未勾选';
  $('clear-selection').hidden=!selected.size;$('preview-batch').disabled=!selected.size;
  $('rows').querySelectorAll('[data-check]').forEach(input=>{input.checked=selected.has(input.dataset.check);input.closest('tr').classList.toggle('selected',input.checked)});
}
function emptyResults(){
  const container=$('empty');container.replaceChildren();
  const title=document.createElement('h3'),hint=document.createElement('p');
  container.append(title,hint);
  if(state.view==='queue'&&!book.queue.length){title.textContent='本班清单还是空的';hint.textContent='在全部设备中勾选需要复核的设备后加入。';const b=document.createElement('button');b.className='minor';b.textContent='去全部设备';b.onclick=()=>changeTab('ledger');container.append(b);return}
  title.textContent='没有符合条件的设备';hint.textContent='可以移除一个条件，保留其余查找范围。';
  for(const [key,name] of [['q','关键词'],['area','区域'],['status','状态']]){
    if(!state[key])continue;
    const n=rows({...state,[key]:''}).length;
    const b=document.createElement('button');b.className='minor';b.textContent='移除'+name+'（'+n+' 台）';b.dataset.reviewId='asset-relax-'+key;b.onclick=()=>{apply({[key]:''});focus(key==='q'?'query':key)};container.append(b);
  }
}
function drawList(){
  setContext('list');
  const all=rows(),pages=Math.max(1,Math.ceil(all.length/pageSize)),before=state.page;
  state.page=Math.min(pages,state.page);if(before!==state.page)writeRoute();
  const visible=pageSlice(all),ledger=state.view==='ledger';
  $('tab-ledger').setAttribute('aria-pressed',ledger);$('tab-queue').setAttribute('aria-pressed',!ledger);
  $('ledger-count').textContent=data.length;$('queue-count').textContent=book.queue.length;
  $('query').value=state.q;$('area').value=state.area;$('status').value=state.status;$('sort').value=state.sort;
  $('undo-bar').hidden=!book.lastBatch.length;$('undo-description').textContent='最近一次加入 '+book.lastBatch.length+' 台设备';
  drawChips();
  $('rows').innerHTML=visible.map(row=>'<tr><td>'+(ledger?'<label class="row-select" data-review-id="asset-select-'+row.id+'"><input type="checkbox" data-check="'+row.id+'" aria-label="勾选 '+row.id+' '+row.name+'"></label>':'<span aria-hidden="true">✓</span>')+'</td><td><button class="open" id="asset-'+row.id+'" data-open="'+row.id+'" data-review-id="asset-'+row.id+'">'+row.name+'</button><span class="secondary code mono">'+row.id+'</span></td><td>'+row.area+'</td><td>'+pill(row)+'</td><td><time>'+row.time+'</time></td><td class="'+(reason(row.id)?'muted':'eligible')+'">'+availability(row.id)+'</td></tr>').join('');
  $('scope').hidden=!ledger;$('table').hidden=!all.length;$('empty').hidden=Boolean(all.length);if(!all.length)emptyResults();
  $('range').textContent=all.length?'第 '+((state.page-1)*pageSize+1)+'–'+((state.page-1)*pageSize+visible.length)+' 台，共 '+all.length+' 台':'共 0 台';
  $('pages').textContent=all.length?state.page+' / '+pages:'0 / 0';$('prev').disabled=state.page<=1;$('next-page').disabled=state.page>=pages;
  describeScope(all,visible);
}
function apply(patch){
  const changed=Object.keys(patch).some(key=>patch[key]!==state[key]);
  if(!changed){drawList();return}
  const changesScope=Object.keys(patch).some(key=>['view','q','area','status'].includes(key)&&patch[key]!==state[key]);
  const old=changesScope?selected.size:0;if(changesScope)selected.clear();
  Object.assign(state,patch,{page:1,asset:''});writeRoute();drawList();
  message((old?'已清除先前勾选的 '+old+' 台。':'')+'当前范围 '+rows().length+' 台。');
}
function changeTab(view){if(state.view!==view)apply({view,q:'',area:'',status:''});focus(view==='ledger'?'tab-ledger':'tab-queue')}
function drawDetail(){
  const row=byId.get(state.asset);setContext('detail');
  const fields=[['所在区域',row.area],['具体位置',row.location],['责任人',row.owner],['计划巡检',row.time],['本班复核',availability(row.id)]];
  $('detail-content').innerHTML='<span class="mono code">'+row.id+'</span><h2 id="detail-name" tabindex="-1" data-review-id="assets-detail-title">'+row.name+'</h2><div class="keyline">'+pill(row)+'<span>'+row.area+' · '+row.location+'</span></div><h3>巡检记录</h3><p>'+row.note+'</p><h3>设备资料</h3><dl class="facts">'+fields.map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl>';
}
function openDetail(id){
  if(!byId.has(id))return false;
  if(state.asset===id&&document.body.dataset.reviewContext==='detail')return true;
  pending=null;needsReview=false;
  if(document.body.dataset.reviewContext==='list'){
    writeRoute('replaceState',{listScroll:window.scrollY,returnId:id,listMessage:$('message').textContent});
    state.asset=id;writeRoute('pushState',{detailEntry:true});
  }else{state.asset=id;writeRoute('replaceState',{detailEntry:Boolean(history.state?.detailEntry)})}
  drawDetail();window.scrollTo(0,0);focus('detail-name');message('');return true;
}
window.formaOpenReviewObject=openDetail;
function returnToList(id,position){
  state.asset='';drawList();const target=$('asset-'+id);
  if(target){target.focus({preventScroll:true});if(position==null)target.scrollIntoView({block:'center'});else window.scrollTo(0,position)}
  else{focus('query');window.scrollTo(0,0)}
}
function batchEntries(ids,source=book){return ids.map(id=>({id,reason:reason(id,source)}))}
function drawBatch(){
  setContext('batch');
  const eligible=pending.filter(item=>!item.reason),skipped=pending.filter(item=>item.reason);
  const lines=items=>'<ul class="batchrows">'+items.map(({id,reason:why})=>'<li><span><b>'+byId.get(id).name+'</b> <small class="mono">'+id+'</small></span><span>'+(why||byId.get(id).area)+'</span></li>').join('')+'</ul>';
  $('batch-content').innerHTML='<h2 id="batch-title" tabindex="-1" data-review-id="assets-batch-title">核对复核范围</h2><p class="keyline batch-summary">已勾选 '+pending.length+' 台，计划加入 <b>'+eligible.length+' 台</b>，跳过 '+skipped.length+' 台。</p>'+
    (eligible.length?'<h3>将加入本班清单</h3>'+lines(eligible):'')+(skipped.length?'<h3>跳过的设备及原因</h3>'+lines(skipped):'')+
    '<div class="actions"><button id="confirm-batch" class="primary" data-review-id="assets-confirm" '+(!eligible.length?'disabled':'')+'>确认加入 '+eligible.length+' 台</button><button class="minor" id="change-selection">修改勾选</button></div>';
}
function leaveBatch(){pending=null;needsReview=false;drawList();focus('preview-batch')}
async function updateBook(action){
  if(busy)return;busy=true;
  try{
    const run=()=>{const fresh=readBook(),next=action(fresh);if(next){localStorage.setItem(prefix,JSON.stringify(next));book=next;storageError=false;return true}book=fresh;return false};
    const saved=navigator.locks?.request?await navigator.locks.request(prefix,run):run();
    return saved;
  }catch{message('当前浏览器未能保存清单，勾选仍可继续核对。');storageError=true;return false}
  finally{busy=false}
}
async function confirmBatch(){
  if(busy||!pending)return;
  if(needsReview){pending=batchEntries(pending.map(x=>x.id));needsReview=false;drawBatch();message('清单已更新，请再次核对当前范围。');focus('batch-title');return}
  let stale=false;
  const saved=await updateBook(fresh=>{
    const current=batchEntries(pending.map(x=>x.id),fresh);
    if(current.some((x,i)=>x.reason!==pending[i].reason)){pending=current;stale=true;return null}
    const ids=current.filter(x=>!x.reason).map(x=>x.id);
    return ids.length?{queue:[...fresh.queue,...ids],lastBatch:ids}:null;
  });
  if(stale){drawBatch();message('清单已更新，请再次核对当前范围。');focus('batch-title');return}
  if(saved){const n=book.lastBatch.length;selected.clear();pending=null;drawList();message('已加入 '+n+' 台设备，可在本班清单核对。');focus('tab-queue')}
}
async function undoBatch(){
  if(busy)return;
  const displayed=[...book.lastBatch];
  const saved=await updateBook(fresh=>fresh.lastBatch.join(',')!==displayed.join(',')?null:{queue:fresh.queue.filter(id=>!displayed.includes(id)),lastBatch:[]});
  drawList();if(!storageError)message(saved?'已撤销此次加入的 '+displayed.length+' 台设备。':'清单已更新，请核对最近一次加入。');focus(state.view==='ledger'?'tab-ledger':'tab-queue');
}
function handlePop(){
  const old=state;state=readRoute();pending=null;needsReview=false;
  if(['view','q','area','status'].some(key=>old[key]!==state[key]))selected.clear();
  if(state.asset){message('');drawDetail();focus('detail-name')}
  else{message(history.state?.listMessage||'');returnToList(history.state?.returnId||old.asset,history.state?.listScroll)}
}
function addOption(select,key,text){const option=document.createElement('option');option.value=key;option.textContent=text;select.append(option)}
addOption($('area'),'','全部区域');areas.forEach(area=>addOption($('area'),area,area));
addOption($('status'),'','全部状态');Object.entries(statuses).forEach(([key,name])=>addOption($('status'),key,name));
$('filters').onsubmit=event=>{event.preventDefault();apply({q:$('query').value.trim()})};
for(const key of ['area','status','sort'])$(key).onchange=()=>apply({[key]:$(key).value,q:$('query').value.trim()});
$('tab-ledger').onclick=()=>changeTab('ledger');$('tab-queue').onclick=()=>changeTab('queue');
$('rows').onclick=event=>{const button=event.target.closest('[data-open]');if(button)openDetail(button.dataset.open)};
$('rows').onchange=event=>{const id=event.target.dataset.check;if(!id)return;if(event.target.checked)selected.add(id);else selected.delete(id);const all=rows();describeScope(all,pageSlice(all))};
$('page-select').onchange=()=>{const all=rows(),visible=pageSlice(all);for(const row of visible){if($('page-select').checked)selected.add(row.id);else selected.delete(row.id)}describeScope(all,visible)};
$('select-all').onclick=()=>{const all=rows();all.forEach(row=>selected.add(row.id));describeScope(all,pageSlice(all))};
$('clear-selection').onclick=()=>{selected.clear();const all=rows();describeScope(all,pageSlice(all));focus('page-select')};
for(const [id,delta] of [['prev',-1],['next-page',1]])$(id).onclick=()=>{state.page+=delta;writeRoute();drawList();message($('range').textContent);if($(id).disabled)focus(delta>0?'prev':'next-page')};
$('preview-batch').onclick=()=>{if(!selected.size)return;pending=batchEntries([...selected]);needsReview=false;message('');drawBatch();window.scrollTo(0,0);focus('batch-title')};
$('batch-back').onclick=leaveBatch;$('batch-content').onclick=e=>{if(e.target.id==='confirm-batch')confirmBatch();if(e.target.id==='change-selection')leaveBatch()};
$('undo-batch').onclick=undoBatch;
$('detail-back').onclick=()=>{if(location.protocol!=='file:'&&history.state?.detailEntry){history.back();return}
  const id=state.asset;state.asset='';const all=rows(),index=all.findIndex(row=>row.id===id);
  if(index>=0)state.page=Math.floor(index/pageSize)+1;writeRoute();returnToList(id,null)};
window.addEventListener('popstate',handlePop);
window.addEventListener('storage',event=>{if(event.key!==prefix)return;try{book=readBook();if(pending){needsReview=true;message('其他页面已修改本班清单，确认前将重新核对。')}else if(state.asset)drawDetail();else drawList()}catch{message('本班清单读取失败。')}});
if(state.asset)drawDetail();else drawList();if(storageError)message('无法读取本班清单，请检查浏览器存储。');
</script>
</body>
</html>
