<style>

*{box-sizing:border-box} body{margin:0} h1,h2,h3,p,ol,dl,dd{margin:0}

.note-label{display:block;font-weight:650;margin:16px 0 5px}

.durability,.mini-help,.footnote{color:var(--muted);font-size:12px;line-height:1.65}.durability{margin:5px 0 16px;min-height:20px}
.primary,.secondary{border:1px solid var(--navy);border-radius:3px;min-height:43px;padding:8px 16px;font-weight:650;background:var(--navy);color:white}.primary:hover{background:#2d4a72}.secondary{color:var(--ink);background:var(--sheet);border-color:#9aa8b4}.secondary:hover{background:#e9edf0}
.wide{width:100%;display:flex;align-items:center;justify-content:space-between}.mini-help{margin-top:8px}.footnote{padding:14px 0 27px}
.proof,.archive{display:none}.panel-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0}.panel-top .mini-help{margin:5px 0 0}.actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.paper{background:white;color:#172332;max-width:920px;margin:0 auto 26px;padding:40px 42px;border:1px solid #b9bfc4;box-shadow:0 4px 15px #1e2c3d0a;overflow-wrap:anywhere}

.archive h1{font-size:36px}.archive .context{color:var(--muted);margin:5px 0 17px}.doc-list{display:grid;gap:8px;list-style:none;padding:0}

[data-review-context="preview"] .desk,[data-review-context="issued"] .desk,[data-review-context="archive"] .desk{display:none}

@media(max-width:920px){.page{width:calc(100% - 40px)}.workspace{gap:15px;grid-template-columns:minmax(0,1.55fr) minmax(245px,.88fr)}.editor{padding-inline:14px}.issue{grid-template-columns:64px minmax(0,1fr) 50px;gap:7px}}

@media(max-width:340px){.site{font-size:11px}.page{width:calc(100% - 20px)}.archive-link{padding:5px 7px}.route-times b{font-size:26px}.paper .doc-code{font-size:10px}}
@page{
  margin:14mm 14mm 15mm;
  @bottom-right{content:"第 " counter(page) " 页 / 共 " counter(pages) " 页";font:8pt "Microsoft YaHei",sans-serif;color:#333}
}
@media print{
  :root,body{font-family:"Microsoft YaHei",sans-serif!important;color:#111!important;background:#fff!important;font-size:10pt}

  .paper{padding:0;border:0;margin:0;max-width:none;box-shadow:none;color:#000}

  .paper th,.paper td,.paper .doc-code{font-size:9.5pt;line-height:1.5;padding:2.4mm 2mm;color:#111;background:white!important;border-color:#888}
  .paper thead th{color:#111}

  .paper .c-id{width:14%}.paper .c-name{width:25%}.doc-head h2{font-size:20pt}.doc-meta{font-size:9pt}

  .paper .group td{padding:4mm 2mm 1mm;border-bottom:1.3pt solid black}.paper .end{font-size:9pt}
  .archive .secondary{display:none}.doc-list li{background:white;break-inside:avoid}.archive .context{color:#333}
}
</style>

let cameFromArchive=false;
let canSave=true;
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function proofHash(value){
  let hash=2166136261;
  for(let i=0;i<value.length;i++) hash=Math.imul(hash^value.charCodeAt(i),16777619);
  return (hash>>>0).toString(36).toUpperCase()+value.length.toString(36).toUpperCase();
}
function writeLocal(key,value){
  try {localStorage.setItem(key,value);canSave=true;}
  catch {canSave=false;}
}
function readDraft(shift){
  if(drafts.has(shift.id)) return drafts.get(shift.id);
  let note=shift.note;
  try {note=localStorage.getItem(prefix+'draft:'+shift.id)??note;}catch{canSave=false;}
  drafts.set(shift.id,note);
  return note;
}
function validDocument(doc,key){
  const stringRows=(rows,n)=>Array.isArray(rows)&&rows.every(row=>Array.isArray(row)&&row.length===n&&row.every(v=>typeof v==='string'));
  return doc && doc.id===key && /^JD-1107-[A-F0-9]{12}$/.test(key)
    && byId.has(doc.shiftId) && typeof doc.createdAt==='number' && Number.isFinite(doc.createdAt)
    && ['date','area','depart','arrive','hours','nextHours','outgoing','incoming','note'].every(k=>typeof doc[k]==='string')
    && stringRows(doc.issues,6) && stringRows(doc.checks,4);
}
function readArchive(){
  try {
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key?.startsWith(archivePrefix))continue;
      const id=key.slice(archivePrefix.length);
      let doc;
      try {doc=JSON.parse(localStorage.getItem(key));}catch{continue;}
      if(validDocument(doc,id))documents.set(id,doc);
    }
  }catch{canSave=false;}
  byElement('archive-count').textContent=documents.size;
}
function captureDraft(){
  return {shiftId:active.id,date:dateLabel,area:active.area,depart:active.depart,arrive:active.arrive,
    hours:active.hours,nextHours:active.nextHours,outgoing:active.outgoing,incoming:active.incoming,
    note:readDraft(active),issues:active.issues.map(row=>row.slice()),
    checks:(active===shifts[0]?inspections:inspections.slice(8)).map(row=>row.slice())};
}
function documentFingerprint(doc){
  const {id,createdAt,...content}=doc;
  return proofHash(JSON.stringify(content));
}
function announce(message){byElement('announce').textContent=message;}
function updateStorage(){
  byElement('storage-state').textContent=canSave?'草稿自动保存在本浏览器':'草稿仅保留至本页关闭';
}
function renderDesk(){
  const draft=captureDraft();
  byElement('shift').value=active.id;
  byElement('shift-code').textContent=active.id;
  byElement('depart').textContent=active.depart;
  byElement('arrive').textContent=active.arrive;
  byElement('depart-meta').textContent='交班 '+active.hours;
  byElement('arrive-meta').textContent='接班 '+active.nextHours;
  for(const name of ['outgoing','incoming','area'])byElement(name).textContent=active[name];
  byElement('issue-total').textContent=active.issues.length+' 项 · 按接手时刻';
  byElement('issues').innerHTML=active.issues.map(([code,level,title,place,due,note])=>`
    <li class="issue" data-review-id="handover-issue-${active.id}-${code}">
      <span class="level ${level==='优先'?'urgent':''}">${level==='优先'?'▲':'●'} ${level}</span>
      <div><h3>${title}</h3><p>${place} · ${note}</p></div>
      <div class="due"><time>${due}</time>接手</div>
    </li>`).join('');
  byElement('check-summary').textContent='已核对设备 · '+draft.checks.length+' 个点位';
  byElement('checklist').innerHTML=draft.checks.map(([code,title,place])=>`<li data-review-id="handover-check-${active.id}-${code}"><span class="code">${code}</span><b>${title}</b><span>${place}</span></li>`).join('');
  byElement('draft-note').value=draft.note;
  byElement('draft-note').dataset.reviewId='handover-note-'+active.id;
  byElement('preview-draft').dataset.reviewId='handover-preview-'+active.id;
  readArchive();
  updateStorage();
}
function headerRow(text){return `<tr class="group"><td colspan="3">${escapeText(text)}</td></tr>`;}
function infoRow(code,name,text){
  return `<tr><th scope="row">${escapeText(code)}</th><td>${escapeText(name)}</td><td class="paper-note">${escapeText(text)}</td></tr>`;
}
function formatTimestamp(value){
  return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(value);
}
function renderPaper(doc){
  const issued=Boolean(doc.id);
  const kind=issued?'已生成':'草稿 · 未生成';
  const record=issued?doc.id:'草稿，无单号';
  const proof=issued?'ISSUED/'+doc.id:'DRAFT/'+doc.shiftId+'/'+documentFingerprint(doc);
  if(context==='preview'||context==='issued')document.body.dataset.reviewProof=proof;
  const records=[...doc.issues.map(([id,level,title,area,time,note])=>infoRow(id,title,level+' · '+area+' · '+time+' 接手\n'+note)),
    headerRow('已核对设备 · '+doc.checks.length+' 个点位'),
    ...doc.checks.map(([id,title,area,note])=>infoRow(id,title,area+' · '+note))];
  const scope=issued?doc.id:doc.shiftId;
  byElement('document-face').innerHTML=`<table>
    <colgroup><col class="c-id"><col class="c-name"><col></colgroup>
    <thead><tr><th colspan="3" class="identity-cell">
      <div class="doc-head"><h2 id="doc-title" tabindex="-1" data-review-id="handover-proof-title-${scope}">设备交接单</h2><strong class="doc-tag">${kind}</strong></div>
      <p class="doc-meta">北麓文化中心（模拟） · ${escapeText(doc.area)} · ${escapeText(doc.date)}</p>
      <p class="doc-meta"><span class="doc-code">${escapeText(doc.shiftId)}</span> · ${escapeText(doc.depart)}（${escapeText(doc.hours)}）→ ${escapeText(doc.arrive)}（${escapeText(doc.nextHours)}）</p>
      <p class="doc-meta">单据编号 <b class="doc-code" id="paper-id">${escapeText(record)}</b></p>
    </th></tr><tr><th scope="col">点位</th><th scope="col">项目</th><th scope="col">交接内容</th></tr></thead>
    <tbody>
      ${infoRow('—','交接人员',doc.outgoing+' 交班 → '+doc.incoming+' 接班')}
      ${infoRow('—','补充说明',doc.note||'无补充说明')}
      ${headerRow('未结事项 · '+doc.issues.length+' 项')}${records.join('')}
    </tbody></table><p class="end">清单结束 · ${escapeText(record)} · ${issued?'本机生成 '+escapeText(formatTimestamp(doc.createdAt))+'（北京时间）':'交班草稿'}</p>`;
}
function switchContext(next){
  context=next;
  document.body.dataset.reviewContext=next;
  delete document.body.dataset.reviewProof;
  window.scrollTo(0,0);
}
function showProof(doc,issued){
  viewed=doc;
  switchContext(issued?'issued':'preview');
  byElement('issue-document').hidden=issued;
  byElement('print-document').textContent=issued?'打印原单':'打印草稿';
  byElement('back-desk').textContent=cameFromArchive?'← 返回单据记录':'← 返回工作台';
  renderPaper(doc);
  byElement('doc-title').focus({preventScroll:true});
}
function startPreview(){
  cameFromArchive=false;
  showProof(captureDraft(),false);
}
function backDesk(){
  const focusBack=context==='archive'?'open-archive':'preview-draft';
  viewed=null;cameFromArchive=false;
  switchContext('desk');renderDesk();renderPaper(captureDraft());
  byElement(focusBack).focus({preventScroll:true});
}
function newId(){
  let id;
  do {
    const bytes=crypto.getRandomValues(new Uint8Array(6));
    id='JD-1107-'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();
  }while(documents.has(id));
  return id;
}
function issueDocument(){
  if(context!=='preview'||!viewed||viewed.id)return;
  readArchive();
  const doc={...viewed,id:newId(),createdAt:Date.now()};
  writeLocal(archivePrefix+doc.id,JSON.stringify(doc));
  documents.set(doc.id,doc);
  byElement('archive-count').textContent=documents.size;
  showProof(doc,true);
  if(!canSave)byElement('document-face').querySelector('.end').append(' · 本页暂存，关闭后清除');
  announce(canSave?'已生成并保存在本机的交接单':'已生成交接单，本页关闭后清除');
}
function renderArchive(){
  readArchive();
  const entries=[...documents.values()].sort((a,b)=>b.createdAt-a.createdAt||b.id.localeCompare(a.id));
  byElement('archive-empty').hidden=entries.length>0;
  byElement('doc-list').innerHTML=entries.map(doc=>`<li>
    <div><strong>${escapeText(doc.depart)} → ${escapeText(doc.arrive)} · ${escapeText(doc.area)}</strong>
    <span class="code">${escapeText(doc.id)}</span><span>${escapeText(formatTimestamp(doc.createdAt))} 生成 · ${escapeText(doc.shiftId)}</span></div>
    <button class="secondary" data-document="${doc.id}" data-review-id="handover-archive-${doc.id}" aria-label="查看原单 ${doc.id}">查看原单</button></li>`).join('');
}
function openArchive(){
  viewed=null;cameFromArchive=true;
  switchContext('archive');renderArchive();byElement('archive-title').focus({preventScroll:true});
}
byElement('shift').replaceChildren(...shifts.map(shift=>new Option(shift.time+' · '+shift.depart+'交'+shift.arrive,shift.id)));
byElement('shift').addEventListener('change',event=>{
  active=byId.get(event.target.value);byElement('check-details').open=false;
  renderDesk();renderPaper(captureDraft());announce('已切换到'+active.depart+'交'+active.arrive);
});
byElement('draft-note').addEventListener('input',event=>{
  const note=event.target.value;
  drafts.set(active.id,note);writeLocal(prefix+'draft:'+active.id,note);
  updateStorage();renderPaper(captureDraft());
});
byElement('preview-draft').addEventListener('click',startPreview);
byElement('issue-document').addEventListener('click',issueDocument);
byElement('print-document').addEventListener('click',()=>window.print());
byElement('open-archive').addEventListener('click',openArchive);
byElement('back-desk').addEventListener('click',()=>cameFromArchive?openArchive():backDesk());
byElement('exit-archive').addEventListener('click',backDesk);
byElement('doc-list').addEventListener('click',event=>{
  const button=event.target.closest('button[data-document]');
  if(button&&documents.has(button.dataset.document))showProof(documents.get(button.dataset.document),true);
});
window.addEventListener('storage',event=>{
  if(!event.key||event.key.startsWith(archivePrefix)){
    if(context==='archive')renderArchive();else readArchive();
  }
  if(event.key?.startsWith(prefix+'draft:')){
    const shift=byId.get(event.key.slice((prefix+'draft:').length));if(!shift)return;
    drafts.set(shift.id,event.newValue??shift.note);
    if(shift===active&&context==='desk'){renderDesk();renderPaper(captureDraft());}
  }
});
renderDesk();renderPaper(captureDraft());
</script>
</body>
</html>
