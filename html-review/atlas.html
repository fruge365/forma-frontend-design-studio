const $=s=>document.querySelector(s),all=s=>Array.from(document.querySelectorAll(s));
const mq=matchMedia('(max-width:740px)');
const state={id:'01',cat:'全部',bank:'所有岸区',mode:'map',remember:'01'};
const cats=['全部','工业','桥埠','公共'],banks=['所有岸区','北岸','南岸','跨河'];
const matching=p=>(state.cat==='全部'||p.cat===state.cat)&&(state.bank==='所有岸区'||p.bank===state.bank);
const current=()=>places.find(p=>p.id===state.id);
const say=t=>{$('#announce').textContent=t};
function buildFilters(){for(const [root,key] of [['#mobile-filters','m'],['#desk-filters','d']]){const h=document.createElement('div');h.className='filters'+(key==='m'?' mobilefilters':'');h.innerHTML='<div class="cats" role="group" aria-label="建筑类别">'+cats.map(c=>'<button type="button" data-cat="'+c+'">'+c+'</button>').join('')+'</div><label class="selectbox"><span class="sr">选择岸区</span><select data-bank>'+banks.map(b=>'<option>'+b+'</option>').join('')+'</select></label>';$(root).replaceChildren(h)}}
function build(){buildFilters();$('#pins').innerHTML=places.map(p=>'<button type="button" class="pin" data-place="'+p.id+'" data-review-id="atlas-pin-'+p.id+'" aria-label="'+p.id+' '+p.name+'，'+p.bank+'，'+p.cat+'" style="left:'+p.x/720*100+'%;top:'+p.y/384*100+'%"><span class="pnum">'+p.id+'</span><span class="pinlabel" aria-hidden="true">'+p.name+'</span></button>').join('');$('#entries').innerHTML=places.map(p=>'<li><button type="button" class="entry" data-place="'+p.id+'" data-review-id="atlas-row-'+p.id+'"><span class="enum">'+p.id+'</span><span><b>'+p.name+'</b><small>'+p.cat+'建筑 · '+p.bank+'</small></span><span class="mark" aria-hidden="true"></span></button></li>').join('')}
function paint(){document.body.dataset.view=state.mode;const m=places.filter(matching),p=current();all('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===state.mode));all('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===state.cat));all('[data-bank]').forEach(b=>b.value=state.bank);all('[data-place]').forEach(b=>{const shown=m.some(p=>p.id===b.dataset.place),on=b.dataset.place===state.id;b.setAttribute('aria-pressed',on);if(b.classList.contains('entry')){b.parentElement.hidden=!shown;b.querySelector('.mark').textContent=on?'✓':'→'}else b.hidden=!shown});
$('#count').textContent='共 '+m.length+' 处';$('#listempty').hidden=$('#mapempty').hidden=!!m.length;$('#emptytext').textContent=state.bank+'没有收录「'+state.cat+'」建筑，重置后可查看全部 6 处。';
const inline=mq.matches&&state.mode==='list'&&p;const target=inline?document.querySelector('[data-review-id=atlas-row-'+p.id+']').parentElement:$('.geo');const detail=$('#detail');if(detail.parentElement!==target)target.append(detail);detail.hidden=!p;if(p){detail.innerHTML='<figure class="plate" aria-label="'+p.name+'原创立面线描"><svg viewBox="0 0 142 94" aria-hidden="true" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.6"><path d="M3 86h136M3 89h136" opacity=".3" stroke-width=".7"/>'+plates[Number(p.id)-1]+'</svg><figcaption>PLATE '+p.id+' / 06</figcaption></figure><div class="detailinfo"><div class="detailtop"><span class="serial">手记 '+p.id+'</span><span class="type">'+p.bank+' · '+p.cat+'建筑</span></div><h3 data-review-id="atlas-detail-'+p.id+'" tabindex="-1">'+p.name+'</h3><p data-review-id="atlas-note-'+p.id+'">'+p.note+'</p>'+(inline?'<button class="returnrow" type="button" data-return>返回所选条目</button>':'')+'</div>'}else detail.replaceChildren()}
function alignSelection(){const visible=places.filter(matching);if(!visible.length){state.id='';return}if(!visible.some(p=>p.id===state.id)){state.id=(visible.find(p=>p.id===state.remember)||visible[0]).id}}
function filter(){alignSelection();paint();say('筛选后共 '+places.filter(matching).length+' 处'+(current()?'，当前为'+current().name:''))}
function setMode(m){state.mode=m;paint()}
function choose(id){state.id=state.remember=id;paint();say('已选 '+id+' '+current().name+'，观察手记已更新。')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-return')){document.querySelector('[data-review-id=atlas-row-'+state.id+']').focus()}else if(b.hasAttribute('data-mode'))setMode(b.dataset.mode);else if(b.hasAttribute('data-cat')){state.cat=b.dataset.cat;filter()}else if(b.hasAttribute('data-place')){choose(b.dataset.place);if(mq.matches&&state.mode==='list'){$('#detail h3').focus()}}else if(b.hasAttribute('data-reset')){state.cat='全部';state.bank='所有岸区';filter();const dest=mq.matches?$('#mobile-filters [data-cat]'):$('#desk-filters [data-cat]');dest.focus()}});document.addEventListener('change',e=>{if(e.target.hasAttribute('data-bank')){state.bank=e.target.value;filter()}});$('.skip').addEventListener('click',e=>{e.preventDefault();setMode('list');$('#catalog-start').focus()});mq.addEventListener('change',paint);
window.formaRevealSpatial=id=>{if(typeof id!=='string')return false;const a=/^atlas-(pin|row|detail|note)-(0[1-6])$/.exec(id);if(!a)return false;const p=places.find(p=>p.id===a[2]);if(state.cat!=='全部'&&state.cat!==p.cat)state.cat='全部';if(state.bank!=='所有岸区'&&state.bank!==p.bank)state.bank='所有岸区';if(a[1]==='pin')state.mode='map';if(a[1]==='row')state.mode='list';state.id=state.remember=p.id;paint();return true};
build();paint();
</script></body></html>
