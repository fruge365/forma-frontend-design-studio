<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>场地借用 · 栖原公共文化馆</title>
<style>
:root{--paper:#f4f1e9;--card:#fffdf7;--ink:#282b25;--muted:#5e6357;--line:#cac8b9;--brand:#772f36;--pale:#f4e6e1;--ok:#355840;--error:#963919;--success:#e4eddd;font:16px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #226988;outline-offset:3px}
[hidden]{display:none!important}.wrap{max-width:1256px;padding:0 clamp(16px,4vw,64px);margin:auto}
.top{background:#32372e;color:#fffdf5}.bar{min-height:61px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:10px;align-items:center;font-weight:680;letter-spacing:.06em}.mark{display:inline-block;width:27px;height:22px;border-block:3px solid #f3d29f;position:relative;background:repeating-linear-gradient(90deg,#f3d29f 0 3px,transparent 3px 8px)}.mark:before{content:"";position:absolute;top:-8px;left:-2px;right:-2px;height:2px;background:#f3d29f}
.roles{display:inline-flex;gap:2px;padding:3px;border:1px solid #697062;border-radius:4px}.roles button{background:transparent;color:#e5e9da;min-height:34px;padding:4px 13px;border:0;border-radius:2px;font-size:14px}.roles button[aria-pressed=true]{background:#eae9db;color:#30372e;font-weight:700}
.mast{display:flex;justify-content:space-between;align-items:end;gap:15px;padding:clamp(20px,3.8vw,50px) 0 22px;border-bottom:2px solid #393b32}
h1{margin:0;font-family:"Songti SC",SimSun,serif;font-weight:700;letter-spacing:-.045em;line-height:1.12;font-size:clamp(39px,5vw,72px)}.intro{color:var(--muted);margin:8px 0 0}.statusbox{text-align:right;font-size:13px}.statusbox b{font-size:14px}.id{font:13px/1.5 "IBM Plex Mono",Consolas,monospace;color:var(--muted);display:block;margin-top:3px}
.bodygrid{display:grid;grid-template-columns:minmax(155px,200px) minmax(0,1fr);gap:clamp(20px,4vw,64px);margin-top:24px;align-items:start}
.side h2{font-size:14px;color:var(--muted);margin:0 0 9px}.steps{list-style:none;padding:0;margin:0}.steps li{border-top:1px solid var(--line)}.steps li:last-child{border-bottom:1px solid var(--line)}.steps button{width:100%;background:none;border:0;text-align:left;display:flex;align-items:center;gap:12px;min-height:49px;padding:6px 4px;color:var(--muted);font-size:15px}.steps [aria-current=step]{color:var(--brand);font-weight:700}.steps .index{width:22px;flex:none;font:13px "IBM Plex Mono",Consolas,monospace}.steps [aria-current=step] .index{border-bottom:2px solid var(--brand)}
.mobile-step{display:none}.card{min-width:0;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);padding:clamp(16px,2.7vw,35px);box-shadow:0 4px 12px #38332206}
.card h2{font-size:clamp(24px,2.5vw,34px);margin:0 0 5px;line-height:1.25;letter-spacing:-.03em}.card h3{font-size:17px;margin:0 0 7px}.sub,.hint,.foot{color:var(--muted)}.sub{margin:0 0 19px;font-size:14px}.hint{margin:4px 0 0;font-size:13px}
fieldset{min-width:0;margin:0;padding:0;border:0}.label,legend{display:block;padding:0;margin:0 0 7px;font-size:15px;font-weight:650}.required{font-size:12px;font-weight:500;color:var(--muted);margin-left:5px}
.room-map{display:grid;grid-template-columns:1.2fr .85fr .85fr;gap:7px;background:#eeecdf;border:1px solid #bcbba9;position:relative;padding:11px 11px 25px}.room-map:after{content:'公共通廊';font-size:11px;position:absolute;bottom:2px;left:50%;transform:translateX(-50%);color:#595e50;letter-spacing:.18em}.room-choice{position:relative;min-width:0}.room-choice input,.chip input{position:absolute;left:10px;top:13px;width:16px;height:16px;accent-color:var(--brand)}.room-choice span{display:flex;min-height:78px;padding:9px 10px 8px 34px;flex-direction:column;justify-content:center;gap:1px;border:1px solid #919682;color:#384034;background:#f9f8ef;cursor:pointer}.room-choice strong{font-size:16px}.room-choice small{font-size:13px}.room-choice input:checked+span,.chip input:checked+span{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--pale);color:#662a2f}.room-choice input:focus-visible+span,.chip input:focus-visible+span{outline:3px solid #226988;outline-offset:2px}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 17px}.field{margin-top:16px;min-width:0}.box{display:block;width:100%;background:#fffef9;border:1px solid #9b9e90;border-radius:3px;min-height:44px;padding:8px 10px}textarea.box{min-height:80px;resize:vertical}input[type=date]{min-width:0}input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border:2px solid var(--error)}
.choices{display:flex;gap:8px;flex-wrap:wrap}.chip{position:relative;min-width:92px}.chip span{background:white;border:1px solid #9b9e90;border-radius:3px;display:flex;align-items:center;min-height:44px;padding:6px 15px 6px 35px;cursor:pointer}.chip input{top:11px}
.err{color:var(--error);font-size:13px;font-weight:650;margin:4px 0 0}.err:empty{display:none}.summary,.correction,.warnbox{border-left:4px solid var(--error);background:#fcf0e4;padding:12px 14px;margin:0 0 16px;color:#72371f}.summary b,.correction b{display:block}.summary a{display:inline-block;color:inherit;margin:3px 15px 0 0}.correction p,.warnbox p{margin:2px 0;overflow-wrap:anywhere}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:23px;border-top:1px solid var(--line);padding-top:16px}.actions .savehint{font-size:12px;margin-left:auto;color:var(--muted)}.btn{padding:9px 15px;min-height:44px;border:1px solid #8e9182;background:var(--card);border-radius:3px;font-weight:650;font-size:14px}.primary{background:var(--brand);border-color:var(--brand);color:#fffdf5}.textbtn{background:none;border:0;padding:5px 3px;text-decoration:underline;text-underline-offset:3px;color:var(--brand);min-height:40px;font-weight:650}
.pairhead{display:flex;align-items:center;justify-content:space-between;gap:9px;border-bottom:1px solid var(--line);margin-top:16px}.pairhead h3{margin:0}.facts{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:7px 14px;margin:12px 0 17px;font-size:14px}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.tag{display:inline-block;border-radius:3px;color:#4d4d3c;background:#e7e7d9;padding:3px 9px;font-size:13px;font-weight:650}.tag.approved{background:var(--success);color:var(--ok)}.tag.returned{background:#ffebd6;color:#77421b}.tag.submitted{background:#e6eaf1;color:#3c526a}
.ledger{padding:0;list-style:none;margin:13px 0 0;border-left:1px solid #b9bdac}.ledger li{padding:0 0 15px 16px;position:relative}.ledger li:last-child{padding-bottom:0}.ledger li:before{content:'';position:absolute;top:7px;left:-4px;width:7px;height:7px;background:var(--brand);border-radius:50%}.ledger b{font-size:14px}.ledger time,.ledger small{font-size:12px;color:var(--muted);margin-left:8px}.ledger p{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
.queue{width:100%;border:1px solid var(--line);background:var(--card);padding:14px;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left}.queue b,.queue small{display:block}.queue small{color:var(--muted);margin-top:3px}.decisionbox{border:1px solid #c9bbab;background:#f7f1e7;margin:17px 0 0;padding:16px}.foot{margin:14px 0 26px;font-size:12px}.notice{margin-top:12px;color:var(--error);font-size:14px}.notice:empty{display:none}
@media(max-width:760px){.bodygrid{display:block;margin-top:15px}.side{display:none}.mobile-step{display:block;color:var(--brand);font-size:13px;font-weight:700;margin:0 0 6px}.mast{padding-bottom:14px}.card{padding:17px 15px}.room-map{gap:4px;padding:7px 6px 21px;grid-template-columns:repeat(3,minmax(0,1fr))}.room-choice span{min-height:67px;padding:24px 3px 5px;text-align:center}.room-choice input{left:50%;top:5px;margin:0;transform:translateX(-50%);width:14px;height:14px}.room-choice strong{font-size:14px}.room-choice small{font-size:12px}.roles button{min-height:38px;padding:3px 8px}.bar{min-height:55px}.brand{font-size:14px;gap:8px}.mark{width:21px;height:18px}.actions .savehint{width:100%;margin-left:0}.intro{font-size:14px}.cells{gap:10px}.statusbox{max-width:42%}.facts{grid-template-columns:5.5em minmax(0,1fr)}}
@media(max-width:365px){.wrap{padding:0 11px}.brand{letter-spacing:0}.mark{display:none}.card{padding:14px 10px}.roles button{font-size:13px}.cells{grid-template-columns:1fr}.room-choice strong{font-size:13px}.facts{gap:6px}.mast{align-items:flex-start}.id{font-size:11px}}
.tag{white-space:nowrap}.statusbox{flex:none}.card h2,.queue b{overflow-wrap:anywhere}.queue>span:first-child{min-width:0}
.archived{margin-top:5px;font-size:14px}.archived summary{color:var(--brand);cursor:pointer;width:fit-content;min-height:36px;padding:6px 0}.archived summary:focus-visible{outline:3px solid #226988;outline-offset:2px}.archive-sheet{background:#f4f2e8;border:1px solid var(--line);padding:4px 13px}.archive-sheet .pairhead{margin-top:8px}.archive-sheet h3{font-size:15px}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><div class="brand"><i class="mark" aria-hidden="true"></i>栖原公共文化馆</div><nav class="roles" aria-label="切换演示角色"><button id="applicant" type="button" data-review-id="intake-role-applicant">申请人</button><button id="reviewer" type="button" data-review-id="intake-role-reviewer">值班员</button></nav></div></header>
<main class="wrap">
  <div class="mast"><div><h1 id="page-title"></h1><p class="intro" id="intro"></p></div><div class="statusbox" id="status"></div></div>
  <div class="notice" id="notice" role="alert"></div>
  <div class="bodygrid"><aside class="side" id="side"></aside><article class="card" id="panel" aria-labelledby="section-title"></article></div>
  <footer class="foot">本机演示 · 申请人与值班员共用当前浏览器的记录。</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const key='forma-intake-v1:'+new URL('.',location.href).pathname;
const rooms={hall:['庭院讲堂',60],studio:['工艺教室',24],gallery:['南廊展厅',40]};
const slots={'am':'上午 09:00–12:00','pm':'下午 14:00–17:00','eve':'傍晚 18:00–20:00'};
const groups=['场地与时段','活动与设备','核对申请'];
const phaseNames={draft:'草稿',submitted:'待审批',returned:'待补正',approved:'已批准'};
const contexts=['applicant-space','applicant-plan','applicant-check'];
const cleanFields=()=>({room:'',date:'',slot:'',people:'',title:'',unit:'',sound:'no',soundNote:''});
const initial=()=>({serial:0,phase:'draft',id:'',revision:0,step:0,editing:false,fields:cleanFields(),filed:null,history:[],correction:null});
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const attr=esc;
const editable=s=>s.phase==='draft'||s.phase==='returned'&&s.editing;
function read(){
  const stored=localStorage.getItem(key);
  if(stored===null)return initial();
  const s=JSON.parse(stored);
  if(!Object.hasOwn(phaseNames,s.phase)||!Number.isInteger(s.serial)||!s.fields||!Array.isArray(s.history)||![0,1,2].includes(s.step))throw Error('Invalid record');
  return s;
}
let state=initial(),storageFault=false;
try{state=read()}catch{storageFault=true}
let role=location.hash.startsWith('#review')?'review':'apply';
let detail=location.hash==='#review-detail',returnForm=false,editFromCheck=false;
let errors={},returnReason='',returnGroup='0',busy=false;
const fieldLabels={room:'借用场地',date:'借用日期',slot:'使用时段',people:'参加人数',title:'活动名称',unit:'主办单位',sound:'扩音设备',soundNote:'扩音安排'};
function commit(next){
  try{
    const latest=read();
    if(latest.serial!==state.serial){
      state=latest;render();
      $('notice').textContent='另一窗口已更新申请，请核对当前内容后再操作。';return false;
    }
    next.serial=state.serial+1;localStorage.setItem(key,JSON.stringify(next));
    state=next;storageFault=false;$('notice').textContent='';return true;
  }catch{storageFault=true;$('notice').textContent='本机存储不可用，当前操作尚未保存。请保留此页，恢复存储后重试。';return false}
}
function draftValue(id,value){
  if(!editable(state))return;
  const next=structuredClone(state);
  next.fields[id]=value;
  if(id==='sound'&&value!=='yes')next.fields.soundNote='';
  if(!commit(next))return;
  if(id==='room')$('capacity-hint').textContent='最多 '+rooms[value][1]+' 人。';
  if(id==='sound'){
    $('sound-extra').hidden=value!=='yes';
    if(value!=='yes'){$('soundNote').value='';delete errors.soundNote;displayErrors(false)}
  }
  if(errors[id]){delete errors[id];displayErrors(false)}
  const saved=$('save-hint');if(saved)saved.textContent='草稿已保存在本机';
}
function validate(group,f){
  const e={};
  if(group===0){
    if(!Object.hasOwn(rooms,f.room))e.room='请选择一个借用场地。';
    if(!/^\d{4}-\d\d-\d\d$/.test(f.date))e.date='请选择借用日期。';
    if(!Object.hasOwn(slots,f.slot))e.slot='请选择使用时段。';
    const cap=rooms[f.room]?.[1]||60;
    if(!/^\d+$/.test(f.people)||Number(f.people)<1||Number(f.people)>cap)e.people='请输入 1 至 '+cap+' 之间的整数。';
  }else{
    if(!f.title.trim())e.title='请填写活动名称。';
    if(!f.unit.trim())e.unit='请填写主办单位或团队名称。';
    if(f.sound==='yes'&&!f.soundNote.trim())e.soundNote='请填写使用的设备和扩音安排。';
  }
  return e;
}
function focusField(id){
  const control=id==='room'?document.querySelector('input[name=room]'):$(id);
  control?.focus();control?.scrollIntoView({block:'nearest'});
}
function displayErrors(focus){
  const summary=$('errors');if(!summary)return;
  const entries=Object.entries(errors);
  summary.hidden=!entries.length;
  summary.innerHTML=entries.length?'<b>请检查以下 '+entries.length+' 项</b>'+entries.map(([id])=>'<a href="#'+id+'" data-error-for="'+id+'">'+fieldLabels[id]+'</a>').join(''):'';
  for(const id of Object.keys(fieldLabels)){
    const output=$('error-'+id);if(!output)continue;
    output.textContent=errors[id]||'';
    const controls=id==='room'?document.querySelectorAll('input[name=room]'):[$(id)];
    for(const c of controls)if(c){if(errors[id])c.setAttribute('aria-invalid','true');else c.removeAttribute('aria-invalid')}
  }
  if(focus&&entries.length)focusField(entries[0][0]);
}
function goStep(step,fromCheck=false){
  if(!editable(state))return;
  if(storageFault&&!flushVisible())return;
  if(step>state.step){
    for(let i=0;i<step;i++){
      const issues=validate(i,state.fields);
      if(Object.keys(issues).length){
        if(i!==state.step){const next=structuredClone(state);next.step=i;if(!commit(next))return;render()}
        errors=issues;displayErrors(true);return;
      }
    }
  }
  const next=structuredClone(state);next.step=step;
  if(!commit(next))return;
  editFromCheck=fromCheck;errors={};render(true);
}
function flushVisible(){
  // Retry a failed draft save with the values the person can still see.
  const next=structuredClone(state);
  for(const control of document.querySelectorAll('[data-field]')){
    if(control.type==='radio'&&!control.checked)continue;
    next.fields[control.dataset.field]=control.value;
  }
  if(next.fields.sound!=='yes')next.fields.soundNote='';
  return commit(next);
}
function field(id,input,required=true,hint=''){
  return '<div class="field"><label class="label" for="'+id+'">'+fieldLabels[id]+(required?'<span class="required">必填</span>':'')+'</label>'+input+(hint?'<p class="hint" id="hint-'+id+'">'+hint+'</p>':'')+'<p class="err" id="error-'+id+'"></p></div>';
}
function attrs(id){return ' id="'+id+'" data-field="'+id+'" data-review-id="intake-'+id+'" aria-describedby="error-'+id+'" aria-required="true"'}
function sectionTitle(title,sub,prefix=''){
  return (prefix?'<p class="mobile-step">'+prefix+'</p>':'')+'<h2 id="section-title" tabindex="-1">'+title+'</h2>'+(sub?'<p class="sub">'+sub+'</p>':'');
}
function errorBox(){return '<div class="summary" id="errors" role="alert" hidden></div>'}
function correction(){
  const c=state.correction;
  if(state.phase!=='returned'||!c)return '';
  return '<div class="correction" data-review-id="intake-message"><b>请补正 · '+groups[c.group]+'</b><p>'+esc(c.reason)+'</p></div>';
}
function formFooter(){
  const back=state.step===1?'<button type="button" class="btn" data-step="0">上一步</button>':'';
  return '<div class="actions">'+back+'<button id="next" data-review-id="intake-next" class="btn primary" type="submit">'+(editFromCheck?'返回核对':state.step===0?'下一步 · 活动与设备':'下一步 · 核对申请')+'</button><span id="save-hint" class="savehint">'+(state.serial&&!storageFault?'草稿已保存在本机':'填写后自动保存草稿')+'</span></div>';
}
function form(){
  const f=state.fields,s=state.step;
  const top=sectionTitle(groups[s],s===0?'选择场地，再确定借用时间和人数。':'填写活动用途，并说明是否需要现场扩音。','第 '+(s+1)+' / 3 步');
  let fields='';
  if(s===0){
    fields='<fieldset><legend>借用场地<span class="required">必填</span></legend><div class="room-map" data-review-id="intake-room-map">'+Object.entries(rooms).map(([id,[name,cap]])=>'<label class="room-choice"><input type="radio" name="room" data-field="room" data-review-id="intake-room-'+id+'" value="'+id+'" aria-required="true" aria-describedby="error-room" '+(f.room===id?'checked':'')+'><span><strong>'+name+'</strong><small>'+cap+' 人</small></span></label>').join('')+'</div><p class="err" id="error-room"></p></fieldset>'+
    '<div class="cells">'+field('date','<input class="box" type="date"'+attrs('date')+' value="'+attr(f.date)+'">')+field('slot','<select class="box"'+attrs('slot')+'><option value="">选择时段</option>'+Object.entries(slots).map(([id,label])=>'<option value="'+id+'" '+(f.slot===id?'selected':'')+'>'+label+'</option>').join('')+'</select>')+'</div>'+
    field('people','<input class="box" id="people" type="number" min="1" step="1" inputmode="numeric" data-review-id="intake-people" data-field="people" aria-required="true" aria-describedby="capacity-hint error-people" value="'+attr(f.people)+'"><p class="hint" id="capacity-hint">'+(rooms[f.room]?'最多 '+rooms[f.room][1]+' 人。':'按所选场地的容量填写。')+'</p>');
  }else{
    fields=field('title','<input class="box"'+attrs('title')+' maxlength="80" value="'+attr(f.title)+'">')+
    field('unit','<input class="box"'+attrs('unit')+' maxlength="80" value="'+attr(f.unit)+'">')+
    '<fieldset class="field"><legend>现场扩音</legend><div class="choices">'+[['no','不需要'],['yes','需要']].map(([value,label])=>'<label class="chip"><input type="radio" name="sound" value="'+value+'" data-field="sound" data-review-id="intake-sound-'+value+'" '+(f.sound===value?'checked':'')+'><span>'+label+'</span></label>').join('')+'</div></fieldset>'+
    '<div id="sound-extra" '+(f.sound==='yes'?'':'hidden')+'>'+field('soundNote','<textarea class="box"'+attrs('soundNote')+' maxlength="300">'+esc(f.soundNote)+'</textarea>',true,'例如使用一支无线话筒，音量限于室内。')+'</div>';
  }
  return top+correction()+errorBox()+'<form id="application-form" novalidate>'+fields+formFooter()+'</form>';
}
function facts(f,withLinks){
  const pair=(k,v)=>'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>';
  const title=(g)=>'<div class="pairhead"><h3>'+groups[g]+'</h3>'+(withLinks?'<button type="button" class="textbtn" data-edit="'+g+'" data-review-id="intake-edit-'+g+'">修改 '+groups[g]+'</button>':'')+'</div>';
  return title(0)+'<dl class="facts">'+pair('场地',rooms[f.room]?.[0])+pair('日期 / 时段',f.date+' · '+slots[f.slot])+pair('参加人数',f.people+' 人')+'</dl>'+
    title(1)+'<dl class="facts">'+pair('活动名称',f.title)+pair('主办单位',f.unit)+pair('现场扩音',f.sound==='yes'?'需要':'不需要')+(f.sound==='yes'?pair('扩音安排',f.soundNote):'')+'</dl>';
}
function check(){
  return sectionTitle('核对申请','提交前可以分别修改两组资料。','第 3 / 3 步')+correction()+facts(state.fields,true)+'<div class="actions"><button id="submit-request" class="btn primary" data-review-id="intake-submit">'+(state.phase==='returned'?'重新提交申请':'提交借用申请')+'</button></div>';
}
function timeline(){
  return '<div data-review-id="intake-history"><h3>办理记录</h3><ol class="ledger">'+state.history.slice().reverse().map(event=>{
    const d=new Date(event.at);
    const submitted=event.kind==='submitted'||event.kind==='resubmitted';
    let archive='';
    if(submitted){
      archive=event.snapshot?'<details class="archived" data-review-id="intake-version-'+Number(event.revision)+'"><summary>查看第 '+Number(event.revision)+' 版提交资料</summary><div class="archive-sheet">'+facts(event.snapshot,false)+'</div></details>':'<p class="hint">此历史版本未保存提交资料。</p>';
    }
    return '<li><b>'+({submitted:'已提交申请',returned:'退回补正',resubmitted:'已重新提交',approved:'批准借用'}[event.kind])+'</b><small>第 '+event.revision+' 版</small><time datetime="'+attr(event.at)+'">'+esc(d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}))+'</time>'+(event.reason?'<p>'+groups[event.group]+' · '+esc(event.reason)+'</p>':'')+archive+'</li>';
  }).join('')+'</ol></div>';
}
function applicantStatus(){
  const label={submitted:'已提交，等待值班员审批。',returned:'请按值班员的意见修正相应资料。',approved:'值班员已批准此场次的借用。'}[state.phase];
  return sectionTitle('申请进度',label)+correction()+(state.phase==='returned'?'<button id="correct-request" class="btn primary" data-review-id="intake-correct">修改'+groups[state.correction.group]+'</button>':'')+facts(state.filed,false)+timeline();
}
function queue(){
  const item=state.id?'<button id="open-review" class="queue" data-review-id="intake-open-review"><span><b>'+esc(state.filed.title)+'</b><small>'+esc(state.id)+' · '+esc(rooms[state.filed.room][0])+' · '+esc(state.filed.date)+'</small></span><span class="tag '+state.phase+'">'+phaseNames[state.phase]+' ›</span></button>':'<p>目前没有已提交的借用申请。</p><div class="actions"><button class="btn" data-role="apply">前往填写申请</button></div>';
  return sectionTitle('申请列表','当前浏览器中的借用申请。')+item;
}
function reviewDetail(){
  const actions=state.phase==='submitted'?'<div class="actions"><button class="btn primary" id="approve" data-review-id="intake-approve">批准借用</button><button class="btn" id="ask-correction" data-review-id="intake-ask-correction">退回补正</button></div>':'';
  const reasonForm='<form class="decisionbox" id="correction-form" novalidate><h3>退回补正</h3><label class="label" for="return-group">需要修改的分组</label><select id="return-group" class="box">'+groups.slice(0,2).map((g,i)=>'<option value="'+i+'" '+(Number(returnGroup)===i?'selected':'')+'>'+g+'</option>').join('')+'</select><div class="field"><label class="label" for="return-reason">具体原因<span class="required">必填</span></label><textarea class="box" id="return-reason" data-review-id="intake-return-reason" maxlength="300" aria-required="true" aria-describedby="return-error">'+esc(returnReason)+'</textarea><p class="err" id="return-error" role="alert"></p></div><div class="actions"><button class="btn primary" id="confirm-return" data-review-id="intake-return">确认退回</button><button type="button" class="btn" id="cancel-return">取消</button></div></form>';
  return '<button class="textbtn" id="back-list">‹ 返回申请列表</button>'+sectionTitle(esc(state.filed.title),esc(state.id)+' · 第 '+state.revision+' 版')+facts(state.filed,false)+timeline()+(returnForm&&state.phase==='submitted'?reasonForm:actions);
}
function render(focus=false){
  const isReview=role==='review';
  const ctx=isReview?(detail&&state.id?'review-detail':'review-queue'):editable(state)?contexts[state.step]:'applicant-status';
  document.body.dataset.reviewContext=ctx;
  $('applicant').setAttribute('aria-pressed',String(!isReview));$('reviewer').setAttribute('aria-pressed',String(isReview));
  $('page-title').textContent=isReview?'借用审批':'场地借用';$('intro').textContent=isReview?'核对场次与活动安排，处理馆内空间借用。':'办理讲座、工作坊和展览的场地借用。';
  $('status').innerHTML='<b class="tag '+state.phase+'">'+phaseNames[state.phase]+'</b>'+(state.id?'<span class="id">'+esc(state.id)+'</span>':'');
  if(!isReview&&editable(state)){
    $('side').innerHTML='<h2>申请步骤</h2><ol class="steps">'+groups.map((g,i)=>'<li><button type="button" data-step="'+i+'" '+(state.step===i?'aria-current="step"':'')+'><span class="index">'+String(i+1).padStart(2,'0')+'</span>'+g+'</button></li>').join('')+'</ol>';
    $('panel').innerHTML=state.step<2?form():check();
  }else{
    $('side').innerHTML='<h2>办理信息</h2><p class="hint">'+(isReview?'公共文化馆 · 值班受理':'公共文化馆 · 我的申请')+'</p>';
    $('panel').innerHTML=isReview?(detail&&state.id?reviewDetail():queue()):applicantStatus();
  }
  if(storageFault)$('notice').textContent='本机存储不可用。已输入内容需成功保存后才能继续。';
  if(focus)$('section-title')?.focus({preventScroll:false});
}
function setRole(next,showDetail=false){
  if(editable(state)&&storageFault&&!flushVisible())return;
  role=next;detail=showDetail;returnForm=false;returnReason='';errors={};editFromCheck=false;
  if(location.protocol!=='file:')history.replaceState(null,'',role==='review'?(detail?'#review-detail':'#review'):'#apply');
  render(true);
}
async function transition(kind){
  if(busy)return;
  if(kind==='return'&&!returnReason.trim()){
    $('return-error').textContent='请填写申请人能据此修改的具体原因。';$('return-reason').setAttribute('aria-invalid','true');$('return-reason').focus();return;
  }
  busy=true;
  const run=()=>{
    const s=structuredClone(state);
    if(kind==='submit'){
      if(!editable(s)||s.step!==2)return;
      for(let i=0;i<2;i++){if(Object.keys(validate(i,s.fields)).length){goStep(i);errors=validate(i,s.fields);displayErrors(true);return}}
      const prior=s.phase;
      s.filed={...s.fields,title:s.fields.title.trim(),unit:s.fields.unit.trim(),soundNote:s.fields.sound==='yes'?s.fields.soundNote.trim():''};
      if(s.filed.sound!=='yes')delete s.filed.soundNote;
      if(!s.id)s.id='QY-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16).toUpperCase().padStart(8,'0');
      s.phase='submitted';s.revision++;s.editing=false;s.correction=null;
      s.history.push({kind:prior==='returned'?'resubmitted':'submitted',revision:s.revision,at:new Date().toISOString(),snapshot:structuredClone(s.filed)});
    }else{
      if(s.phase!=='submitted'||role!=='review')return;
      s.phase=kind==='return'?'returned':'approved';s.editing=false;
      s.correction=kind==='return'?{group:Number(returnGroup),reason:returnReason.trim()}:null;
      s.history.push({kind:s.phase,revision:s.revision,at:new Date().toISOString(),...(s.correction||{})});
    }
    if(!commit(s))return;
    returnForm=false;returnReason='';errors={};render(true);
  };
  try{if(navigator.locks)await navigator.locks.request(key,run);else run()}finally{busy=false}
}
document.addEventListener('input',e=>{
  const c=e.target;
  if(c.id==='return-reason'){returnReason=c.value;$('return-error').textContent='';c.removeAttribute('aria-invalid');return}
  if(c.id==='return-group'){returnGroup=c.value;return}
  if(c.dataset.field&&(c.type!=='radio'||c.checked))draftValue(c.dataset.field,c.value);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.errorFor){e.preventDefault();focusField(b.dataset.errorFor);return}
  if(b.id==='applicant'||b.dataset.role==='apply'){setRole('apply');return}
  if(b.id==='reviewer'||b.id==='back-list'){setRole('review');return}
  if(b.id==='open-review'){setRole('review',true);return}
  if(b.hasAttribute('data-step')){goStep(Number(b.dataset.step));return}
  if(b.hasAttribute('data-edit')){goStep(Number(b.dataset.edit),true);return}
  if(b.id==='submit-request'){transition('submit');return}
  if(b.id==='approve'){transition('approve');return}
  if(b.id==='ask-correction'){returnForm=true;returnReason='';returnGroup='0';render();$('return-group').focus();return}
  if(b.id==='cancel-return'){returnForm=false;render();$('ask-correction').focus();return}
  if(b.id==='correct-request'){const s=structuredClone(state);s.step=s.correction.group;s.editing=true;if(commit(s))render(true)}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='application-form'){e.preventDefault();goStep(editFromCheck?2:state.step+1)}
  if(e.target.id==='correction-form'){e.preventDefault();returnGroup=$('return-group').value;returnReason=$('return-reason').value;transition('return')}
});
window.addEventListener('storage',e=>{if(e.key!==key)return;try{state=read();returnForm=false;errors={};render()}catch{storageFault=true;render()}});
render();
</script>
</body></html>
