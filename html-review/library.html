;top:-1px;font-size:9px;font-weight:400}.seat[data-filtered=true]{visibility:hidden}.entrance{color:var(--muted);font-size:12px;letter-spacing:.08em;text-align:center;margin-top:14px}.legend{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin:12px 0 0;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;background:#f3f7ef;border:1px solid #9cb09c;border-radius:2px}.legend .selected{background:var(--brand);border-color:var(--brand)}.legend .mine{border:2px solid var(--brand);background:#dceade}.help{color:var(--muted);font-size:13px;margin:14px 0 0;line-height:1.8}.message{margin:8px 0 0;color:var(--brand);font-size:14px;line-height:1.7}.message:empty{display:none}.rules{margin-top:22px;border-top:1px solid var(--line);padding-top:4px;color:var(--muted);font-size:14px}.rules summary{cursor:pointer;color:var(--brand);min-height:44px;padding:11px 0}.rules p{margin:0 0 9px;line-height:1.8}

.date strong, .date small, .slot strong, .slot small { display: block; }

<body><a class="skip" href="#seats">跳到座位图</a>
<header class="masthead"><div class="container"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4c3-1 6 0 9 2 3-2 6-3 9-2v15c-3-1-6 0-9 2-3-2-6-3-9-2zM12 6v15M6 8l3 1M6 12l3 1M15 9l3-1M15 13l3-1"/></svg>阅川图书馆</div><div class="user-tools"><span class="demo">本地服务演示</span><button class="simple" id="myBookings">我的预约 <span class="count" id="my-count">0</span></button></div></div></header>
<main class="container"><div class="page-title"><h1>自习座位预约</h1><p>选择到馆时段和座位。所选座位仅在本机演示中保留。</p></div>
<section class="success" id="result" hidden><strong id="result-title">本地预约已保存</strong><p id="receipt"></p><button class="link-button" id="show-receipts">查看或取消我的预约</button></section>
<div class="layout"><aside class="filters" aria-label="预约条件">
<fieldset class="fields"><legend>到馆日期 <small>2026 年 11 月</small></legend><div class="dates" id="dates"></div></fieldset>
<fieldset class="fields"><legend>预约时段</legend><div class="times" id="slots"></div></fieldset>
<fieldset class="fields"><legend>阅览区域</legend><div class="zones" id="zones"></div></fieldset>
</aside><section class="room" aria-labelledby="zoneTitle"><div class="room-head"><h2 class="map-title" id="zoneTitle">二层静阅区 · 选座</h2><span class="available" id="available"></span></div><div class="seat-tools"><label><input id="accessOnly" type="checkbox">只看无障碍位</label><button id="quickSeat" class="link-button">帮我选座</button></div><div class="map"><div class="window">靠窗一侧</div><div class="seats" id="seats" role="group" aria-label="座位示意图" tabindex="-1"></div><div class="entrance">入口 ↓</div></div>
<div class="legend" aria-label="座位图例"><span><i></i>可选</span><span><i class="selected"></i>已选</span><span><i class="taken"></i>已占用</span><span><i class="mine"></i>我的预约</span><span><b class="access-sample">无障碍</b>入口侧座位</span></div><p id="message" class="message" role="status"></p></section></div>
<details class="rules"><summary>预约记录与座位说明</summary><p>每个日期、时段和区域拥有独立的座位状态。确认后可在「我的预约」查看和取消，取消后释放对应座位。记录仅保存在当前浏览器，演示不连接图书馆的真实库存。</p></details>
<p id="storage-note" class="storage-note" role="status"></p>
</main>
<div class="bottom" id="confirm-bar"><div class="container"><div class="selection"><strong id="selectionTitle">请选择座位</strong><small id="selectionDetail"></small></div><button class="primary" disabled id="continue">确认选择</button></div></div>
<dialog id="confirmDialog" aria-labelledby="dialogTitle"><div class="dialog-inner"><div class="dialog-head"><h2 id="dialogTitle">确认预约信息</h2><button class="close" data-close aria-label="关闭确认窗口">×</button></div><p class="dialog-note">保存后，这个座位会在当前浏览器的演示中标记为“我的预约”。</p><dl class="summary" id="summary"></dl><p id="confirm-error" class="storage-note" role="status"></p><div class="actions"><button class="simple" id="back" data-close>返回选座</button><button class="primary" id="confirm">保存预约</button></div></div></dialog>
<dialog id="bookingsDialog" aria-labelledby="bookings-title"><div class="dialog-inner"><div class="dialog-head"><h2 id="bookings-title">我的预约</h2><button data-close class="close" aria-label="关闭我的预约">×</button></div><p class="dialog-note">按日期和时段排列。取消后，对应的座位立即释放。</p><div id="reservations"></div><p id="booking-status" class="message" role="status"></p><button class="link-button" hidden id="undo-cancel">恢复刚取消的预约</button></div></dialog>
<script>
const DATES = [
  {id:'2026-11-13', label:'11 月 13 日', day:'11 / 13', week:'周五'},
  {id:'2026-11-14', label:'11 月 14 日', day:'11 / 14', week:'周六'},
  {id:'2026-11-15', label:'11 月 15 日', day:'11 / 15', week:'周日'}
];
const SLOTS = [
  {id:'am', name:'上午', time:'09:00–12:00'},
  {id:'pm', name:'下午', time:'13:00–17:00'},
  {id:'ev', name:'晚间', time:'18:00–21:00'}
];
const ZONES = [
  {id:'A', name:'二层 · 静阅区', info:'安静阅读 · 独立桌'},
  {id:'B', name:'三层 · 学习区', info:'电脑友好 · 全席插座'}
];
const projectPath=location.protocol==='file:'?'/':new URL('.',location.href).pathname;
const storageKey = 'yuechuan-study-seats-v1'+(projectPath==='/'?'':':'+projectPath);
const get = id => document.getElementById(id);
let dateIndex = 0, slotIndex = 0, zoneIndex = 0;
let selected = null;
let memoryOnly = false;
let bookings = [];
let lastCancelled = null;
let returnFocus = null;
let savedFocus = null;
function seatLabel(z, n) { return ZONES[z].id + String(n).padStart(2, '0'); }
function keyFor(d, t, z, n) { return [DATES[d].id, SLOTS[t].id, ZONES[z].id, n].join('|'); }
function inventoryTaken(d, t, z, n) { return (n + d*3 + t*5 + z*2) % 7 === 0 || (n + d + t*2) % 9 === 0; }
function parseKey(key) {
  if (typeof key !== 'string') return null;
  const parts = key.split('|');
  if (parts.length !== 4) return null;
  const d = DATES.findIndex(x => x.id === parts[0]), t = SLOTS.findIndex(x => x.id === parts[1]), z = ZONES.findIndex(x => x.id === parts[2]), n = Number(parts[3]);
  if (d < 0 || t < 0 || z < 0 || !Number.isInteger(n) || n < 1 || n > 24 || String(n) !== parts[3] || inventoryTaken(d,t,z,n)) return null;
  return {d,t,z,n,key};
}
function loadBookings() {
  if (memoryOnly) return [...bookings];
  try {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return [];
    const record = JSON.parse(raw);
    if (record?.version !== 1 || !Array.isArray(record.bookings)) return [];
    return [...new Set(record.bookings.filter(key => parseKey(key)))].sort();
  } catch {
    memoryOnly = true;
    get('storage-note').textContent = '当前存储不可用，预约仅保留到关闭本页。';
    return [...bookings];
  }
}
function persist(keys) {
  bookings = [...new Set(keys)].sort();
  if (memoryOnly) return;
  try { localStorage.setItem(storageKey, JSON.stringify({version:1, bookings})); }
  catch {
    memoryOnly = true;
    get('storage-note').textContent = '当前存储不可用，预约仅保留到关闭本页。';
  }
}
async function mutateBookings(action) {
  const commit = () => action(loadBookings());
  if (!navigator.locks?.request) return commit();
  try { return await navigator.locks.request(storageKey, commit); }
  catch (error) {
    if (error.name === 'SecurityError' || error.name === 'NotSupportedError') return commit();
    throw error;
  }
}
function make(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
function describe(record) {
  return [DATES[record.d].label, SLOTS[record.t].time, ZONES[record.z].name, seatLabel(record.z, record.n)].join(' · ');
}
function currentSeats() {
  return Array.from({length:24}, (_, i) => {
    const number = i + 1, key = keyFor(dateIndex, slotIndex, zoneIndex, number);
    const mine = bookings.includes(key), taken = inventoryTaken(dateIndex, slotIndex, zoneIndex, number);
    return {number,key,label:seatLabel(zoneIndex,number),accessible:number===21||number===24,mine,taken,free:!mine&&!taken};
  });
}
function makeChoices(id, items, tag, title, caption, select) {
  for (const [i, item] of items.entries()) {
    const b = make('button', undefined, 'choice '+tag);
    b.dataset.reviewId = 'library-'+tag+'-'+item.id;
    b.dataset.option = String(i);
    const text = make('span');
    text.append(make('strong', title(item)), make('small', caption(item)));
    b.append(text);
    if (tag === 'zone') {
      const tick = make('i','✓','tick'); tick.setAttribute('aria-hidden','true'); b.append(tick);
    }
    b.onclick = () => {
      select(i); selected = null;
      get('message').textContent = '预约条件已更新，请选择座位。';
      render();
    };
    get(id).append(b);
  }
}
function showChoices(id, index) {
  for (const b of get(id).children) b.setAttribute('aria-pressed', String(Number(b.dataset.option) === index));
}
function chooseSeat(number, restore) {
  const seat = currentSeats().find(s => s.number === number && s.free);
  if (!seat) return;
  selected = number;
  get('message').textContent = '已选 '+seat.label+(seat.accessible?' 无障碍位':'')+'，可在下方确认。';
  renderSeats(); renderSelection();
  if (restore) get('seats').querySelector('[data-seat="'+number+'"]')?.focus({preventScroll:true});
}
function renderSeats() {
  const seats = currentSeats(), accessible = get('accessOnly').checked;
  const freeCount = seats.filter(s => s.free && (!accessible || s.accessible)).length;
  get('zoneTitle').textContent = ZONES[zoneIndex].name+' · 选座';
  get('available').textContent = freeCount+' 席可选';
  get('quickSeat').disabled = !freeCount;
  const buttons = seats.map(s => {
    const b = make('button', s.label, 'seat');
    b.dataset.seat = String(s.number);
    b.dataset.reviewId = 'library-seat-'+s.key.replaceAll('|','-');
    const filtered = accessible && !s.accessible;
    b.dataset.filtered = String(filtered);
    b.disabled = filtered || !s.free;
    b.dataset.state = s.mine?'mine':s.taken?'taken':'available';
    b.setAttribute('aria-pressed',String(s.number === selected));
    const status = s.mine?'我的预约':s.taken?'已占用':s.number===selected?'已选':'可预约';
    b.setAttribute('aria-label',s.label+'，'+status+(s.accessible?'，无障碍位':''));
    if (s.mine || s.accessible) {
      b.classList.add('has-label');
      const m = make('span',s.accessible?'无障碍':'我的','mark'); m.setAttribute('aria-hidden','true'); b.append(m);
    }
    b.onclick = () => chooseSeat(s.number,true);
    return b;
  });
  get('seats').replaceChildren(...buttons);
  if (!freeCount) get('message').textContent = '当前条件暂无空位。可换个时段、区域，或取消无障碍筛选。';
}
function renderSelection() {
  const seat = currentSeats().find(s => s.number===selected && s.free);
  get('continue').disabled = !seat;
  get('selectionTitle').textContent = seat ? '已选 '+seat.label+' · '+ZONES[zoneIndex].name : '请选择座位';
  get('selectionDetail').textContent = DATES[dateIndex].label+' · '+SLOTS[slotIndex].time;
}
function render() {
  showChoices('dates',dateIndex); showChoices('slots',slotIndex); showChoices('zones',zoneIndex);
  renderSeats(); renderSelection(); get('my-count').textContent = bookings.length;
}
function openDialog(dialogId, origin, firstFocus) {
  returnFocus = origin;
  get(dialogId).showModal();
  firstFocus.focus();
}
function showBookings(origin) {
  bookings = loadBookings(); lastCancelled = null;
  get('booking-status').textContent = ''; get('undo-cancel').hidden = true;
  render(); renderReceipts();
  openDialog('bookingsDialog', origin, get('bookingsDialog').querySelector('[data-close]'));
}
function renderReceipts() {
  const list = get('reservations');
  list.replaceChildren();
  const records = bookings.map(parseKey).filter(Boolean).sort((a,b) => a.d-b.d || a.t-b.t || a.z-b.z || a.n-b.n);
  if (!records.length) { list.append(make('p','还没有本地预约。选择日期、时段和座位后即可保存。','empty')); return; }
  for (const [i, record] of records.entries()) {
    const row = make('div',undefined,'receipt-row');
    row.dataset.reviewId = 'library-receipt-'+record.key.replaceAll('|','-');
    const text = make('div');
    text.append(make('strong',seatLabel(record.z,record.n)+' · '+ZONES[record.z].name), make('small',DATES[record.d].label+' · '+SLOTS[record.t].time));
    const cancel = make('button','取消预约','link-button');
    if (i===0) cancel.id='cancelBooking';
    cancel.dataset.reviewId = 'library-cancel-'+record.key.replaceAll('|','-');
    cancel.setAttribute('aria-label','取消预约：'+describe(record));
    cancel.onclick = async () => {
      cancel.disabled = true;
      await mutateBookings(keys => {
        if (!keys.includes(record.key)) { bookings=keys; return; }
        persist(keys.filter(k => k!==record.key));
        lastCancelled=record.key;
      });
      get('result').hidden=true; render(); renderReceipts();
      get('booking-status').textContent='已取消 '+seatLabel(record.z,record.n)+'，对应座位已释放。';
      get('undo-cancel').hidden=!lastCancelled; get('undo-cancel').focus();
    };
    row.append(text,cancel); list.append(row);
  }
}
get('undo-cancel').onclick = async () => {
  const record = parseKey(lastCancelled);
  if (!record) return;
  await mutateBookings(keys => {
    if (!keys.includes(record.key)) persist([...keys,record.key]);
    else bookings=keys;
  });
  lastCancelled=null; get('undo-cancel').hidden=true;
  get('booking-status').textContent='已恢复预约：'+describe(record);
  render(); renderReceipts();
  (get('reservations').querySelector('button') || get('bookingsDialog').querySelector('[data-close]')).focus();
};
get('accessOnly').onchange = () => {
  const chosen=currentSeats().find(s=>s.number===selected);
  if (get('accessOnly').checked && !chosen?.accessible) selected=null;
  get('message').textContent=get('accessOnly').checked?'仅显示靠近入口的无障碍位。':'已显示所有座位。';
  renderSeats(); renderSelection();
};
get('quickSeat').onclick = () => {
  const seat=currentSeats().find(s=>s.free && (!get('accessOnly').checked||s.accessible));
  if (seat) chooseSeat(seat.number,false);
};
get('continue').onclick = () => {
  bookings=loadBookings();
  const seat=currentSeats().find(s=>s.number===selected&&s.free);
  if (!seat) { selected=null; get('message').textContent='座位状态已更新，请重新选择。'; render(); return; }
  get('summary').replaceChildren();
  for (const [name,value] of [['日期',DATES[dateIndex].label+' '+DATES[dateIndex].week],['时段',SLOTS[slotIndex].time],['地点',ZONES[zoneIndex].name],['座位',seat.label+(seat.accessible?' · 无障碍位':'')]]) {
    get('summary').append(make('dt',name),make('dd',value));
  }
  get('confirm-error').textContent=''; get('confirm').disabled=false;
  openDialog('confirmDialog',get('continue'),get('back'));
};
get('confirm').onclick = async () => {
  get('confirm').disabled=true;
  const record=parseKey(keyFor(dateIndex,slotIndex,zoneIndex,selected));
  if (!record) { get('confirm-error').textContent='座位选择无效，请返回重新选择。'; return; }
  let saved=false;
  await mutateBookings(keys=>{
    if (keys.includes(record.key)) { bookings=keys; return; }
    persist([...keys,record.key]); saved=true;
  });
  if (!saved) { get('confirm-error').textContent='此座位已被预约，请返回重新选择。'; selected=null; render(); return; }
  get('receipt').textContent=describe(record);
  get('result-title').textContent=memoryOnly?'已保留本次会话预约':'本地预约已保存';
  get('result').hidden=false; selected=null; render();
  get('message').textContent='已保存 '+seatLabel(record.z,record.n)+'，座位已标为我的预约。';
  savedFocus=get('show-receipts'); get('confirmDialog').close();
};
get('myBookings').onclick = () => showBookings(get('myBookings'));
get('show-receipts').onclick = () => showBookings(get('show-receipts'));
for (const b of document.querySelectorAll('[data-close]')) b.onclick = () => b.closest('dialog').close();
for (const dialog of document.querySelectorAll('dialog')) dialog.addEventListener('close', () => {
  const next = savedFocus || (returnFocus && !returnFocus.disabled && returnFocus.getClientRects().length ? returnFocus : get('myBookings'));
  savedFocus=null; returnFocus=null; next.focus();
});
window.addEventListener('storage', event => {
  if (event.key!==storageKey && event.key!==null) return;
  bookings=loadBookings();
  if (selected && !currentSeats().find(s=>s.number===selected&&s.free)) selected=null;
  render();
  if (get('bookingsDialog').open) renderReceipts();
});
makeChoices('dates',DATES,'date',d=>d.day,d=>d.week,i=>dateIndex=i);
makeChoices('slots',SLOTS,'slot',s=>s.name,s=>s.time,i=>slotIndex=i);
makeChoices('zones',ZONES,'zone',z=>z.name,z=>z.info,i=>zoneIndex=i);
bookings=loadBookings(); render();
if ('ResizeObserver' in window) new ResizeObserver(entries=>{
  const height=get('confirm-bar').getBoundingClientRect().height;
  if (height) document.documentElement.style.setProperty('--bar-height',Math.ceil(height)+'px');
}).observe(get('confirm-bar'));
</script></body></html>
