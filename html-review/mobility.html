<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>潮汐调度 · 城市公共单车</title>
<style>
:root{color-scheme:light;--paper:#f5f4ee;--surface:#fffefa;--ink:#142e47;--sub:#485c6b;--rule:#c2cbc7;--accent:#b53c12;--alert-bg:#fff0df;--teal:#286a6b;--focus:#0061b3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Inter","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}button,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{width:min(calc(100% - 72px),1392px);margin:auto}
.skip{position:fixed;top:-100px;left:10px;background:white;padding:10px;z-index:5}.skip:focus{top:8px}
.mast{background:var(--ink);color:white}.mast-inner,.mast-brand,.jump,.titlebar,.date,.section-head,.plan-count,.group,.summary-line{display:flex;align-items:center}
.mast-inner{min-height:58px;justify-content:space-between;gap:12px}.mast-brand{gap:12px;font-weight:650}.mast-brand svg{width:36px;height:32px}.mast small{font-weight:400;color:#d1dadb;padding-left:14px;border-left:1px solid #72808c}
.jump{gap:10px;text-decoration:none;min-height:44px}.jump b{background:#ffb783;color:var(--ink);min-width:26px;text-align:center;border-radius:2px;font:700 15px/24px Consolas,monospace}
.titlebar{padding:24px 0 20px;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);gap:24px}
h1,h2,h3,p{margin:0}h1{font-size:clamp(40px,4.5vw,66px);line-height:1.04;letter-spacing:-.05em;font-weight:800}.titlebar p{margin-top:9px;color:var(--sub)}.date{gap:13px;border-left:1px solid var(--rule);padding-left:22px}.date strong{font:700 clamp(32px,3.2vw,48px)/1 Consolas,"Courier New",monospace;letter-spacing:-.08em}.date span{font-size:13px;line-height:1.5}.date span b{display:block;color:var(--accent)}
.work{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(330px,1fr);gap:32px;margin-top:22px;align-items:start}.left,.right{min-width:0}.section-head{justify-content:space-between;gap:12px;flex-wrap:wrap}.section-head h2{font-size:clamp(20px,2vw,27px);line-height:1.25;letter-spacing:-.03em}.section-head h2:before{content:"";display:inline-block;width:6px;height:.82em;margin-right:10px;background:var(--accent)}
.group{gap:4px;flex-wrap:wrap}.group button,.period{border:1px solid #82928f;background:var(--surface);min-height:38px}.group button{padding:5px 14px}.group button[aria-pressed="true"]{background:var(--ink);color:white;border-color:var(--ink)}button:hover:not(:disabled),select:hover{box-shadow:inset 0 0 0 1px currentColor}.filters{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:15px 0 13px}.period-label{font-size:13px;color:var(--sub);display:flex;gap:7px;align-items:center}.period{font-size:14px;padding:5px 7px;color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin:0;background:var(--surface)}.stats>div{padding:0 clamp(10px,2vw,24px);border-left:1px solid var(--rule);min-width:0}.stats>div:first-child{border:0}.stats dt{font-size:13px;color:var(--sub)}.stats dd{margin:3px 0 0;line-height:1}.num{font:700 clamp(26px,3.2vw,43px)/1.05 Consolas,"Courier New",monospace;letter-spacing:-.065em}.unit{font-size:13px;font-weight:500;margin-left:4px}.trend{color:var(--accent)}
.chart-box{background:var(--surface);padding:15px 16px 11px;border-bottom:1px solid var(--rule)}.chart-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--sub)}.legend{display:flex;gap:12px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:8px;height:8px;display:inline-block;background:var(--ink)}.legend .east{background:var(--accent);transform:rotate(45deg)}.legend .west{background:var(--teal);border-radius:50%}
#chart{width:100%;height:230px;display:block}.chart-foot{font-size:13px;color:var(--sub);margin-top:4px}.data-details{margin-top:8px;font-size:14px}.data-details summary{cursor:pointer;width:fit-content;min-height:36px;display:list-item;align-content:center;font-weight:600}.data-details table{border-collapse:collapse;font-size:14px;width:100%;margin-bottom:12px}.data-details th,.data-details td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--rule)}.data-details th:first-child,.data-details td:first-child{text-align:left}
.right{border-left:1px solid var(--rule);padding-left:26px}.right .section-head small{font-size:13px;color:var(--sub)}.capacity{background:var(--ink);color:white;padding:15px 17px;margin:15px 0 10px}.summary-line{justify-content:space-between;gap:12px}.summary-line strong{font-size:14px;font-weight:600}.summary-line .num{font-size:31px;color:#ffbc8c}.capacity .unit{color:#eaf0f4}.gauge{margin:10px 0 5px;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}.gauge i{height:6px;background:#ffbc8c}.gauge i.used{background:#536b80}.capacity small{color:#e3eaee;font-size:12px}.ranking{list-style:none;padding:0;margin:0}.ranking li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:center;border-bottom:1px solid var(--rule);padding:10px 0}.rank-no{align-self:start;color:var(--sub);font:700 17px/1.55 Consolas,monospace}.ranking li:first-child .rank-no{color:var(--accent)}.station{font-size:17px;font-weight:700}.meta{font-size:13px;color:var(--sub)}.station-gap{font-weight:700;color:var(--accent);margin-right:7px}.add,.undo{min-height:38px;font-size:14px;padding:4px 10px;border:1px solid var(--ink);background:var(--surface);white-space:nowrap}.add{background:var(--ink);color:white}.add:disabled{cursor:default;background:#e1e4df;border-color:#c4ccc8;color:#485c6b}.right-note{font-size:13px;color:var(--sub);margin-top:9px}
.plan{margin-top:23px;border-top:2px solid var(--ink);padding:15px 0 0;scroll-margin:12px}.plan-head{align-items:baseline}.plan-count{gap:5px;color:var(--sub);font-size:14px}.plan-count strong{font-size:20px;color:var(--ink)}.plan-body{margin-top:12px}.empty{padding:14px 18px;background:#e9ede7;color:var(--sub);border-left:3px solid #85968f}.plan-list{padding:0;margin:0;list-style:none}.plan-list li{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding:8px 4px}.plan-list .quantity{font-weight:700;margin-left:auto}.plan-list small{margin-left:10px;color:var(--sub)}.undo{background:transparent}.save{color:var(--sub);font-size:13px;margin:9px 0}.feedback{margin:5px 0;color:var(--accent);font-size:14px;min-height:1.5em}footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0 24px;border-top:1px solid var(--rule);color:var(--sub);font-size:13px}
@media(max-width:1000px){.work{gap:20px;grid-template-columns:minmax(0,1.45fr) minmax(290px,1fr)}.right{padding-left:18px}.wrap{width:calc(100% - 40px)}.ranking li{grid-template-columns:22px minmax(0,1fr) auto;gap:6px}}
@media(max-width:820px){.work{grid-template-columns:1fr}.right{border-left:0;padding-left:0;border-top:2px solid var(--ink);padding-top:14px}.mast small{display:none}.rank-no{align-self:center}.add,.undo,.group button,.period,.data-details summary{min-height:44px}.wrap{width:calc(100% - 32px)}}
@media(max-width:560px){.titlebar{align-items:flex-start;gap:10px;padding:19px 0 15px}.titlebar p{font-size:13px;max-width:17em}.date{padding:3px 0 3px 10px;gap:4px;display:grid;justify-items:end}.date span{text-align:right}.date span b{font-size:12px}.mast-inner{min-height:51px}.mast-brand{gap:7px}.jump{gap:6px;font-size:14px}.work{margin-top:16px;gap:18px}.filters{margin:12px 0}.chart-box{padding:12px 6px 8px}.chart-meta{padding:0 5px}#chart{height:208px}.stats{padding:10px 0}.stats>div{padding:0 8px}.stats dt,.stats .unit{font-size:12px}.num{font-size:28px}.plan-list small{display:block;margin-left:0}.plan{margin-top:17px}.legend{gap:8px}}
@media(max-width:380px){.wrap{width:calc(100% - 22px)}.date strong{font-size:28px}.group button{padding:4px 11px}.period-label{gap:4px}.stats dt{font-size:12px}.section-head h2{font-size:20px}.station{font-size:16px}.chart-meta{font-size:12px}}
</style>
</head>
<body>
<a class="skip" href="#analysis">跳至可借车分析</a>
<header class="mast"><div class="wrap mast-inner">
  <div class="mast-brand"><svg viewBox="0 0 38 34" aria-hidden="true" focusable="false" fill="none"><path d="M2 25h11l12-16h11M2 17h8l10-13h16" stroke="#ffb783" stroke-width="3.4"/><circle cx="9" cy="25" r="5" stroke="white" stroke-width="2.5" fill="#142e47"/><circle cx="29" cy="25" r="5" stroke="white" stroke-width="2.5"/><path d="m23 12 6 13" stroke="white" stroke-width="2.4"/></svg><span>城市公共单车</span><small>运营调度台</small></div>
  <a class="jump" href="#plan" data-review-id="mob-plan-jump">本班清单 <b id="nav-count">0</b><span aria-hidden="true">↓</span></a>
</div></header>
<main class="wrap">
  <div class="titlebar" data-review-id="mob-masthead"><div><h1>潮汐调度</h1><p>两岸早高峰可借车分析 · 演示数据</p></div><div class="date"><strong>07:00</strong><span><b>晨班早会</b>11 月 07 日</span></div></div>
  <div class="work">
    <section class="left" id="analysis" aria-labelledby="analysis-title" data-review-id="mob-analysis"><div class="section-head"><h2 id="analysis-title">可借车走势</h2></div>
      <div class="filters"><div id="regions" class="group" role="group" aria-label="分析区域" data-review-id="mob-regions"><button type="button" data-region="all" aria-pressed="true">全市</button><button type="button" data-region="east" aria-pressed="false">东岸</button><button type="button" data-region="west" aria-pressed="false">西岸</button></div>
        <label class="period-label">时段<select id="period" class="period" data-review-id="mob-period"><option value="full">全时段</option><option value="before">早会前 · 实测</option><option value="after">未来一小时</option></select></label></div>
      <dl id="stats" class="stats" data-review-id="mob-metrics" aria-label="所选区域时段摘要"></dl>
      <div class="chart-box" data-review-id="mob-trend-chart"><div class="chart-meta"><span>可借车（辆）</span><div id="legend" class="legend"></div></div>
        <svg id="chart" role="img" aria-labelledby="chart-title chart-desc"></svg><p id="chart-foot" class="chart-foot"></p></div>
      <details class="data-details" data-review-id="mob-sample-table"><summary>查看逐时点数据</summary><table><caption id="table-caption"></caption><thead id="table-head"></thead><tbody id="table-body"></tbody></table></details>
    </section>
    <section class="right" aria-labelledby="ranking-title" data-review-id="mob-priority"><div class="section-head"><h2 id="ranking-title">优先补车站点</h2><small>按 08:00 预测缺口降序</small></div>
      <div class="capacity" data-review-id="mob-capacity"><div class="summary-line"><strong>本班剩余运力</strong><span><b class="num" id="remaining">24</b><span class="unit"> / 24 辆</span></span></div><div class="gauge" id="gauge" aria-hidden="true"></div><small>两岸共用 · 每站最多补至安全线</small></div>
      <ol class="ranking" id="ranking" aria-label="需补车站点"></ol><p class="right-note" id="rank-note"></p>
    </section>
  </div>
  <section class="plan" id="plan" tabindex="-1" aria-labelledby="plan-title" data-review-id="mob-shift-plan"><div class="section-head plan-head"><h2 id="plan-title">本班调度清单</h2><span class="plan-count" id="plan-count"></span></div>
    <div class="plan-body" id="plan-body"></div><p class="save" id="save-note">清单仅保存在当前浏览器。</p><p class="feedback" id="feedback" role="status" aria-live="polite"></p>
  </section>
  <footer><span>静态演示数据 · 虚构城市 6 站 · 每 15 分钟采样</span><span>2026-11-07 07:00 更新 · 北京时间 UTC+8</span></footer>
</main>
<script>
'use strict';
const stations=[
  {id:'E12',name:'江湾地铁口',region:'east',target:17,stock:[39,36,30,null,null,18,14,10,6,3,2]},
  {id:'E07',name:'滨江科创园',region:'east',target:17,stock:[25,26,25,23,22,23,24,21,18,14,11]},
  {id:'E03',name:'榕树街',region:'east',target:15,stock:[16,17,17,18,18,18,19,20,21,22,23]},
  {id:'W04',name:'西桥换乘站',region:'west',target:18,stock:[26,26,25,22,20,18,18,15,12,9,7]},
  {id:'W11',name:'西堤菜场',region:'west',target:10,stock:[17,17,16,16,15,14,13,11,9,6,5]},
  {id:'W14',name:'林港码头',region:'west',target:16,stock:[14,15,16,17,18,18,19,20,21,22,23]}
];
const names={all:'全市',east:'东岸',west:'西岸'};
const colors={all:'#142e47',east:'#b53c12',west:'#286a6b'};
const ranges={full:[0,10],before:[0,6],after:[6,10]};
const times=['05:30','05:45','06:00','06:15','06:30','06:45','07:00','07:15','07:30','07:45','08:00'];
const capacity=24,meeting=6;
const byId=new Map(stations.map(station=>[station.id,station]));
const byRegion=key=>stations.filter(station=>key==='all'||station.region===key);
const series=Object.fromEntries(Object.keys(names).map(key=>[key,times.map((_,i)=>{
  const records=byRegion(key).map(station=>station.stock[i]);
  return records.includes(null)?null:records.reduce((total,n)=>total+n,0);
})]));
const gap=station=>Math.max(0,station.target-station.stock.at(-1));
const $=id=>document.getElementById(id);
let region='all',period='full';
const directory=location.protocol==='file:'?'':new URL('.',location.href).pathname;
const storageKey='tidal-shift-20261107'+(directory&&directory!=='/'?':'+directory:'');
let storageIssue=false;
function readPlan(){
  try{
    const raw=localStorage.getItem(storageKey);
    const entries=raw===null?[]:JSON.parse(raw);
    if(!Array.isArray(entries))throw Error();
    const seen=new Set();let total=0;
    for(const entry of entries){
      const station=byId.get(entry?.id);
      if(!station||seen.has(station.id)||!Number.isInteger(entry.qty)||entry.qty<1||entry.qty>gap(station))throw Error();
      seen.add(station.id);total+=entry.qty;
    }
    if(total>capacity)throw Error();
    storageIssue=false;return entries.map(({id,qty})=>({id,qty}));
  }catch{storageIssue=true;return []}
}
let plan=readPlan();
function persist(){
  try{localStorage.setItem(storageKey,JSON.stringify(plan));storageIssue=false}
  catch{storageIssue=true}
}
const allocated=()=>plan.reduce((sum,item)=>sum+item.qty,0);
const activeSeries=()=>region==='all'?['all','east','west']:[region];
function renderAnalysis(){
  const [first,last]=ranges[period],keys=activeSeries(),values=series[region],change=values[last]-values[first];
  const metric=(label,value,extra='')=>'<div><dt>'+label+'</dt><dd class="'+extra+'"><b class="num">'+value+'</b><span class="unit">辆</span></dd></div>';
  $('stats').innerHTML=metric(times[first]+' 实测',values[first])+metric(times[last]+(last>meeting?' 预测':' 实测'),values[last])+metric(last>meeting?'预计净变化':'实测净变化',change>0?'+'+change:String(change).replace('-','−'),'trend');
  $('legend').innerHTML=keys.map(key=>'<span><i class="'+key+'" aria-hidden="true"></i>'+names[key]+'</span>').join('');
  $('chart-foot').textContent=(first<meeting&&region!=='west'?'06:15、06:30 江湾地铁口缺报，东岸及全市合计留空。':'')+(last>meeting?'07:00 后虚线为未补车预测。':'实线为已上报库存。');
  $('table-caption').textContent=names[region]+' · '+times[first]+'–'+times[last]+'（辆）';
  $('table-head').innerHTML='<tr><th scope="col">时点</th>'+keys.map(key=>'<th scope="col">'+names[key]+'</th>').join('')+'</tr>';
  $('table-body').innerHTML=times.slice(first,last+1).map((time,index)=>{
    const i=index+first;return '<tr><th scope="row">'+time+(i>meeting?' 预测':' 实测')+'</th>'+keys.map(key=>'<td>'+(series[key][i]??'缺报')+'</td>').join('')+'</tr>';
  }).join('');
  renderChart();
}
function renderChart(){
  const chart=$('chart'),rect=chart.getBoundingClientRect(),width=Math.round(rect.width),height=Math.round(rect.height);
  if(!width||!height)return;
  chart.setAttribute('viewBox','0 0 '+width+' '+height);
  const [first,last]=ranges[period],keys=activeSeries(),left=30,right=20,top=31,bottom=height-27;
  const max=Math.max(...keys.flatMap(key=>series[key].slice(first,last+1).filter(n=>n!==null)));
  const step=max>100?50:max>50?25:10,ceiling=Math.ceil(max/step)*step;
  const x=i=>left+(i-first)*(width-left-right)/(last-first),y=n=>bottom-n/ceiling*(bottom-top);
  const text=(px,py,str,anchor='middle',color='#485c6b')=>'<text x="'+px+'" y="'+py+'" text-anchor="'+anchor+'" fill="'+color+'">'+str+'</text>';
  const line=(x1,y1,x2,y2,attrs)=>'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" '+attrs+'/>';
  let svg='<title id="chart-title">'+names[region]+'可借车走势</title><desc id="chart-desc">'+times[first]+' 至 '+times[last]+'，每 15 分钟采样。'+$('chart-foot').textContent+'可展开逐时点数据表。</desc><g font-family="Consolas,Microsoft YaHei,monospace" font-size="12">';
  if(last>meeting){svg+='<rect x="'+x(meeting)+'" y="'+top+'" width="'+(x(last)-x(meeting))+'" height="'+(bottom-top)+'" fill="#f9eadd"/>'+text((x(meeting)+x(last))/2,19,'预测区间','middle','#92370f')}
  if(first<meeting&&region!=='west'){
    const start=x(3)-Math.min(8,(x(4)-x(3))/4),end=x(4)+Math.min(8,(x(4)-x(3))/4);
    svg+='<rect x="'+start+'" y="'+top+'" width="'+(end-start)+'" height="'+(bottom-top)+'" fill="#e8ece7"/>'+text((start+end)/2,19,'缺报','middle');
  }
  for(let n=0;n<=ceiling;n+=step){svg+=line(left,y(n),width-right,y(n),'stroke="#c9d1cd"')+text(left-5,y(n)+4,String(n),'end')}
  const tickStep=(x(first+1)-x(first))<48?2:1;
  for(let i=first;i<=last;i++){if(i===first||i===last||(i-first)%tickStep===0)svg+=text(x(i),height-7,times[i])}
  if(last>meeting){svg+=line(x(meeting),top,x(meeting),bottom,'stroke="#466578" stroke-dasharray="2 4"')}
  for(const key of keys){
    const values=series[key],color=colors[key];
    for(let i=first+1;i<=last;i++){
      if(values[i-1]===null||values[i]===null)continue;
      const dash=i>meeting?' stroke-dasharray="7 5"':'';
      svg+=line(x(i-1),y(values[i-1]),x(i),y(values[i]),'data-series="'+key+'" data-from="'+(i-1)+'" data-to="'+i+'" stroke="'+color+'" stroke-width="'+(key==='all'?3:2.5)+'"'+dash);
    }
    for(let i=first;i<=last;i++){
      if(values[i]===null)continue;
      const cx=x(i),cy=y(values[i]);
      if(key==='east')svg+='<path fill="'+color+'" d="M'+cx+' '+(cy-3.5)+'l3.5 3.5 -3.5 3.5 -3.5 -3.5Z"/>';
      else if(key==='west')svg+='<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="'+color+'"/>';
      else svg+='<rect x="'+(cx-3)+'" y="'+(cy-3)+'" width="6" height="6" fill="'+color+'"/>';
    }
  }
  const meetingValue=series[region][meeting],anchor=meeting===last?'end':'start';
  svg+=text(x(meeting)+(anchor==='end'?-4:4),y(meetingValue)-8,'实测 '+meetingValue,anchor,colors[region]);
  chart.innerHTML=svg+'</g>';
}
function renderPlan(){
  const used=allocated(),left=capacity-used;
  const entries=byRegion(region).filter(station=>gap(station)>0).sort((a,b)=>gap(b)-gap(a)||a.id.localeCompare(b.id));
  $('remaining').textContent=left;
  $('gauge').innerHTML=Array.from({length:capacity},(_,i)=>'<i'+(i<left?'':' class="used"')+'></i>').join('');
  $('ranking').innerHTML=entries.map((station,index)=>{
    const entry=plan.find(item=>item.id===station.id),need=gap(station),qty=Math.min(need,left);
    const label=entry?'撤销 '+entry.qty+' 辆':qty?'＋ 配 '+qty+' 辆':'运力已满';
    const action=entry?'撤销':'加入';
    return '<li data-review-id="mob-station-'+station.id+'"><span class="rank-no">'+String(index+1).padStart(2,'0')+'</span><div><div class="station">'+station.name+'</div><div class="meta">'+names[station.region]+' '+station.id+' · 预测 '+station.stock.at(-1)+' / 安全线 '+station.target+' 辆</div><div class="meta"><span class="station-gap">缺 '+need+' 辆</span>'+(entry?'已配 '+entry.qty+' 辆':'待安排')+'</div></div><button data-station="'+station.id+'" data-review-id="mob-allocate-'+station.id+'" class="'+(entry?'undo':'add')+'" type="button" aria-label="'+station.name+'，'+(entry||qty?action+' '+(entry?.qty??qty)+' 辆':'运力已满')+'"'+(!entry&&!qty?' disabled':'')+'>'+label+'</button></li>';
  }).join('');
  const need=entries.reduce((n,s)=>n+gap(s),0);
  $('rank-note').textContent=names[region]+' '+entries.length+' 站预计短缺 '+need+' 辆。按站点缺口配车，余量不足时配剩余辆数。';
  $('plan-count').innerHTML='<strong>'+plan.length+'</strong> 站 · 已配 <strong>'+used+'</strong> 辆';
  $('nav-count').textContent=plan.length;
  $('plan-body').innerHTML=plan.length?'<ul class="plan-list">'+plan.map(entry=>{
    const station=byId.get(entry.id);return '<li data-review-id="mob-plan-'+entry.id+'"><span><strong>'+station.name+'</strong><small>'+names[station.region]+' '+station.id+'</small></span><span class="quantity">'+entry.qty+' 辆</span><button class="undo" data-remove="'+entry.id+'" aria-label="从清单撤销'+station.name+'" type="button">撤销</button></li>';
  }).join('')+'</ul>':'<p class="empty">尚未分配运力。请在优先补车站点中选择要补车的站。</p>';
  $('save-note').textContent=storageIssue?'本机清单存取异常。请检查浏览器存储设置。':'清单仅保存在当前浏览器。';
}
function changePlan(id,fromList){
  const station=byId.get(id),entry=plan.find(item=>item.id===id);
  if(!station)return;
  const qty=entry?.qty??Math.min(capacity-allocated(),gap(station));
  if(!qty)return;
  plan=entry?plan.filter(item=>item.id!==id):[...plan,{id,qty}];
  persist();renderPlan();
  $('feedback').textContent=station.name+(entry?'已撤销 ':'已配 ')+qty+' 辆，本班剩余 '+(capacity-allocated())+' 辆。';
  const focus=fromList?$('plan-body').querySelector('button')||$('plan'):document.querySelector('[data-station="'+id+'"]');
  focus?.focus({preventScroll:true});
}
$('regions').addEventListener('click',event=>{
  const button=event.target.closest('[data-region]');if(!button)return;region=button.dataset.region;
  for(const item of $('regions').querySelectorAll('button'))item.setAttribute('aria-pressed',String(item===button));
  renderAnalysis();renderPlan();
});
$('period').addEventListener('change',event=>{period=event.target.value;renderAnalysis()});
$('ranking').addEventListener('click',event=>{const button=event.target.closest('[data-station]');if(button&&!button.disabled)changePlan(button.dataset.station,false)});
$('plan-body').addEventListener('click',event=>{const button=event.target.closest('[data-remove]');if(button)changePlan(button.dataset.remove,true)});
window.addEventListener('storage',event=>{if(event.key===storageKey||event.key===null){plan=readPlan();renderPlan()}});
renderAnalysis();renderPlan();
new ResizeObserver(renderChart).observe($('chart'));
</script>
</body>
</html>
