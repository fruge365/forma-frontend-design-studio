<section class="detail" id="flowers" aria-labelledby="flowers-heading"><h2 id="flowers-heading">这束花里</h2><div class="botany"><article><h3>大丽花</h3><p>层层花瓣叠出花束的圆形轮廓，放在明亮、避开直晒的位置。</p></article><article><h3>花烛</h3><p>心形花苞片撑起侧面的线条。擦净叶面水珠，保持花器清洁。</p></article><article><h3>垂穗苋</h3><p>柔软的花穗从束口自然下垂，插瓶时让花穗垂在水面之外。</p></article></div></section>
</main>
<dialog id="list-dialog" aria-labelledby="list-title"><div class="dialog-head"><h2 id="list-title">我的花单</h2><button type="button" class="close" id="close">关闭</button></div><p id="empty" class="empty">花单里还没有花束。选好大小与送花频次后，可以将方案留在这里。</p><ul id="items" class="list"></ul><p id="total" class="total"></p><p id="local" class="local">花单保存在当前浏览器，仅用作选花记录。</p></dialog>
<script>
'use strict';
const sizes={table:{name:'桌花',price:168,spec:'约 8–10 枝 · 适合餐桌'},full:{name:'丰盛',price:268,spec:'约 14–16 枝 · 适合客厅'}};
const intervals={weekly:'每周一束',fortnight:'每两周一束'};
const storeKey='forma-bloom-list-v1:'+new URL('.',location.href).pathname;
const $=id=>document.getElementById(id);
let saved=true,plan=[];
function readPlan(){
  try{
    const value=JSON.parse(localStorage.getItem(storeKey)||'[]');
    const seen=new Set();
    if(!Array.isArray(value))return [];
    return value.filter(row=>{
      if(!row||!Object.hasOwn(sizes,row.size)||!Object.hasOwn(intervals,row.interval))return false;
      const key=row.size+'/'+row.interval;
      if(seen.has(key))return false;
      seen.add(key);return true;
    }).map(row=>({size:row.size,interval:row.interval}));
  }catch {return []}
}
function current(){
  return {size:document.querySelector('input[name="size"]:checked').value,interval:document.querySelector('input[name="interval"]:checked').value};
}
function contains(selection){return plan.some(row=>row.size===selection.size&&row.interval===selection.interval)}
function renderControls(){
  const selected=current(),product=sizes[selected.size];
  $('price').textContent=product.price;
  $('spec').textContent=product.spec;
  document.querySelector('[data-count]').textContent=plan.length;
  $('add').firstChild.nodeValue=contains(selected)?'查看已选方案 ':'加入我的花单 ';
}
function writePlan(){
  try{localStorage.setItem(storeKey,JSON.stringify(plan));saved=true}
  catch{saved=false}
}
function renderList(){
  const items=$('items');items.replaceChildren();
  for(const row of plan){
    const li=document.createElement('li'),description=document.createElement('div');
    const title=document.createElement('strong'),spec=document.createElement('small'),remove=document.createElement('button');
    title.textContent='莓色花信 · '+sizes[row.size].name;
    spec.textContent=intervals[row.interval]+' · ¥'+sizes[row.size].price+'／束';
    remove.type='button';remove.className='remove';remove.textContent='移除';
    remove.setAttribute('aria-label','移除'+sizes[row.size].name+'，'+intervals[row.interval]);
    remove.addEventListener('click',()=>{
      const index=plan.findIndex(item=>item.size===row.size&&item.interval===row.interval);
      plan=plan.filter(item=>item.size!==row.size||item.interval!==row.interval);
      writePlan();renderList();renderControls();$('feedback').textContent='';
      const buttons=items.querySelectorAll('button');(buttons[Math.min(index,buttons.length-1)]||$('close')).focus();
    });
    description.append(title,spec);li.append(description,remove);items.append(li);
  }
  $('empty').hidden=plan.length!==0;$('total').hidden=plan.length===0;
  $('total').textContent='已选 '+plan.length+' 个方案';
  $('local').textContent=saved?'花单保存在当前浏览器，仅用作选花记录。':'花单暂存于此页；当前浏览器无法持久保存。';
}
function openList(){renderList();$('list-dialog').showModal()}
document.querySelectorAll('.config input').forEach(input=>input.addEventListener('change',()=>{$('feedback').textContent='';renderControls()}));
$('add').addEventListener('click',()=>{
  const selected=current();
  if(contains(selected)){openList();return}
  plan.push(selected);writePlan();renderControls();renderList();
  $('feedback').textContent=saved?'已加入花单，可在「我的花单」查看。':'已加入本页花单；当前浏览器无法持久保存。';
});
$('open-list').addEventListener('click',openList);$('close').addEventListener('click',()=>$('list-dialog').close());
window.addEventListener('storage',event=>{if(event.key===storeKey||event.key===null){plan=readPlan();renderControls();renderList();$('feedback').textContent=''}});
plan=readPlan();renderControls();renderList();
</script>
