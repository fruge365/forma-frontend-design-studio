<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9ae5ce">
<title>芽间 · 专注温室</title>
<style>
:root {
  --air:#9ae5ce; --ink:#32284b; --shell:#b9a2f1; --edge:#7763ae; --sun:#ff966d; --ice:#c7f4df;
  font-family:"Trebuchet MS","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--air);font-synthesis:none
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 25% 36%,#c3f0da 0,transparent 51%),linear-gradient(120deg,#90ddc6,#a4e9d4 68%,#92dfc8)}
h1,h2,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:4px solid #35244f;outline-offset:4px}
.bar,.main{width:min(1216px,calc(100% - 9vw));margin:auto}
.bar{height:76px;border-bottom:2px solid #568d83;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:900;letter-spacing:.09em}
.leaf{width:32px;height:30px;position:relative;display:inline-block;color:var(--ink)}
.leaf::before{content:"";position:absolute;left:13px;top:14px;width:5px;height:14px;background:currentColor}
.leaf::after{content:"";position:absolute;background:currentColor;width:5px;height:5px;top:1px;left:23px;box-shadow:-5px 5px,-10px 10px,0 5px,-5px 10px,-10px 5px,-20px 0,-25px 0,-25px 5px,-20px 5px,-15px 10px}
.total{font-size:14px;font-weight:700}.total b{font:800 18px ui-monospace,Consolas,monospace}
.main{padding:clamp(24px,4vh,48px) 0 56px}
.intro{display:flex;align-items:baseline;justify-content:space-between;gap:22px;margin:0 0 23px}
h1{font-size:clamp(38px,4.6vw,68px);letter-spacing:-.07em;line-height:1.14;font-weight:900}
.intro p{font-size:15px;line-height:1.6;font-weight:600}
.console{position:relative;display:grid;grid-template-columns:minmax(0,1.92fr) minmax(230px,1fr);align-items:center;gap:clamp(28px,3.6vw,57px);padding:clamp(24px,3.5vw,52px);background:var(--shell);border:3px solid var(--ink);border-radius:40px 40px 75px 40px;box-shadow:inset 0 6px #dac9ff,inset -6px -9px #9680ce,0 9px 0 var(--ink),0 17px 0 #68b89f}
.screw{position:absolute;width:9px;height:9px;background:var(--edge);border-radius:50%;box-shadow:inset 0 -2px 0 #615184}
.screw.a{left:18px;top:17px}.screw.b{right:19px;top:17px}.screw.c{left:18px;bottom:19px}
.screen{min-width:0;border:3px solid var(--ink);padding:9px;background:#726187;border-radius:19px;box-shadow:0 4px 0 #dbc8ff,inset 0 3px 0 #58486d}
.lcd{overflow:hidden;border:2px solid var(--ink);border-radius:8px;background:var(--ice)}
.readout{padding:clamp(14px,1.7vw,26px) clamp(16px,2vw,30px) 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.status{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.status::before{content:"";width:8px;height:8px;background:#42876b;box-shadow:2px 2px 0 #99d8b0}
.lcd time{display:block;text-align:center;color:#324b53;text-shadow:3px 4px #a0d9b5;letter-spacing:-.08em;white-space:nowrap;font-family:"Courier New",Consolas,monospace;font-size:clamp(65px,7.8vw,118px);font-weight:900;line-height:1.02;font-variant-numeric:tabular-nums;margin:1px 0 -3px}
.garden{display:block;width:100%;height:auto;image-rendering:pixelated}
.bed-caption{background:#78b79f;border-top:3px solid #416b6b;padding:7px 13px;color:#213e41;font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.controls{min-width:0;padding:6px 0 2px}.controls h2{font-size:clamp(23px,2.3vw,34px);letter-spacing:-.045em}
.lengths{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0 24px}
.lengths button,.start,.reset{border:2px solid var(--ink);font-weight:800;min-height:44px;transition:transform .1s,box-shadow .1s}
.lengths button{background:#d9c9fa;border-radius:13px;padding:10px 2px 11px;box-shadow:0 4px 0 var(--edge)}
.lengths b{font:800 clamp(19px,1.8vw,28px) ui-monospace,Consolas,monospace;display:block}
.lengths small{font-size:11px}
.lengths [aria-pressed="true"]{background:#fff19a;box-shadow:inset 0 -3px #e6c86a,0 4px 0 var(--ink)}
.lengths button:disabled{cursor:default}.lengths button:disabled:not([aria-pressed="true"]){opacity:.68}
.start,.reset{width:100%;border-radius:16px;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:12px}
.start{background:var(--sun);font-size:clamp(18px,1.7vw,24px);height:58px}.reset{background:transparent;box-shadow:0 3px var(--edge);height:43px;margin-top:12px;font-size:15px}
.reset:disabled{opacity:.62;cursor:default}.start:active,.lengths button:active:not(:disabled),.reset:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px var(--ink)}
.play{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid var(--ink)}
.start[data-running="true"] .play{width:12px;height:14px;border:0;border-left:4px solid;border-right:4px solid}
.vents{display:flex;justify-content:flex-end;gap:7px;margin:25px 4px 0}.vents i{width:5px;height:21px;background:#806aad;border-radius:3px;transform:rotate(33deg)}
.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}
@media(max-width:790px){.bar,.main{width:min(94%,620px)}.bar{height:56px}.brand{font-size:22px}.intro{display:block}.intro p{margin-top:7px}.console{grid-template-columns:1fr;gap:22px;padding:24px 21px 32px;border-radius:29px 29px 43px 29px}.controls{padding:0 3px}.lengths{margin:10px 0 16px}.controls h2{font-size:22px}.lengths button{padding:6px 3px}.lengths b{display:inline;font-size:22px;margin-right:3px}.vents{display:none}.actions{display:grid;grid-template-columns:1.7fr 1fr;gap:11px}.reset{height:52px;margin:0}.start{height:52px}.lcd time{font-size:clamp(66px,15vw,98px)}.main{padding:22px 0 36px}.intro{margin-bottom:16px}.screw.a,.screw.b{top:9px}.screw.c{bottom:10px}}
@media(max-width:420px){.bar,.main{width:calc(100% - 26px)}.console{padding:18px 12px 24px;gap:17px}.screen{padding:6px}.main{padding-top:18px}.intro p{font-size:13px}.readout{padding:11px 13px 0}.status{font-size:12px}.bed-caption{font-size:11px}.total{font-size:12px}.screw{width:6px;height:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="brand"><i class="leaf" aria-hidden="true"></i>芽间</div><p class="total">本页已完成 <b id="count">0</b> 段</p></header>
<main class="main">
  <div class="intro"><h1>专注温室</h1><p>选一段时长，专注结束后给窗台种一朵花。</p></div>
  <section class="console" aria-label="温室计时器">
    <i class="screw a" aria-hidden="true"></i><i class="screw b" aria-hidden="true"></i><i class="screw c" aria-hidden="true"></i>
    <div class="screen">
      <div class="lcd">
        <div class="readout"><span class="status" id="status">准备专注</span></div>
        <time id="clock" role="timer" data-review-id="sprout-clock" datetime="PT25M">25:00</time>
        <canvas class="garden" id="garden" width="256" height="100" role="img" aria-label="像素温室里的盆栽和窗台花床"></canvas>
        <div class="bed-caption"><span>窗台花床</span><span id="beds">尚未栽花</span></div>
      </div>
    </div>
    <div class="controls">
      <h2 id="duration-label">专注时长</h2>
      <div class="lengths" role="group" aria-labelledby="duration-label">
        <button type="button" data-minutes="15" aria-pressed="false"><b>15</b><small>分钟</small></button>
        <button type="button" data-minutes="25" aria-pressed="true"><b>25</b><small>分钟</small></button>
        <button type="button" data-minutes="45" aria-pressed="false"><b>45</b><small>分钟</small></button>
      </div>
      <div class="actions">
        <button class="start" id="toggle" data-review-id="sprout-toggle" type="button"><i class="play" aria-hidden="true"></i><span>开始专注</span></button>
        <button class="reset" id="reset" type="button" disabled>重置计时</button>
      </div>
      <div class="vents" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </section>
  <p class="sr" id="message" role="status"></p>
</main>
<script>
(() => {
  'use strict';
  const get = id => document.getElementById(id);
  const ctx = get('garden').getContext('2d');
  const fill = (x,y,w,h,c) => {ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
  const ink='#345b58', deep='#347961', leaf='#53a872', lime='#a3d481', mint='#c7f4df',glass='#aee5cd';
  function flower(x,y,palette) {
    fill(x,y,2,10,deep);fill(x-4,y+4,4,2,leaf);fill(x+2,y+3,4,2,leaf);
    fill(x-3,y-3,8,3,palette);fill(x-4,y,10,2,palette);fill(x-1,y-5,4,8,palette);fill(x,y-1,2,2,'#ffe390');
  }
  function pot(x,y,w,h) {
    fill(x+1,y+2,w-2,h-2,ink);fill(x+3,y+3,w-6,h-5,'#d97962');fill(x+3,y+3,3,h-5,'#ffa07c');
    fill(x,y,w,4,ink);fill(x+2,y,w-4,2,'#ffb68e');
  }
  function fern(x,y,size) {
    for(let i=0;i<size;i++){
      fill(x,y-i*3,2,4,deep);
      const len=Math.max(3,Math.round(13*(1-i/size)));
      fill(x-len,y-i*3-2,len,3,i%2?leaf:deep);fill(x-len-2,y-i*3-4,4,3,leaf);
      fill(x+2,y-i*3-4,len,3,i%2?lime:leaf);fill(x+len-1,y-i*3-5,4,2,lime);
    }
  }
  function garden(count){
    if(!ctx)return;
    fill(0,0,256,100,mint);
    const silhouette=['#b5e5ca','#9bd6b9'];
    for(let i=0;i<38;i++){const x=i*8-8,h=4+Math.round(7*(1+Math.sin(i*1.3)));fill(x,61-h,12,h+10,silhouette[i%2]);}
    fill(0,68,256,32,'#93cbb5');
    for(let y=70;y<98;y+=9)for(let x=(y%2)*6;x<256;x+=12)fill(x,y,2,1,'#74b6a2');
    // Cast-iron window frames, the brick sill and two hanging baskets.
    for(const x of [21,85,171,235]){fill(x,1,3,64,'#84bdaa');fill(x+3,5,1,60,glass);}
    for(let x=1;x<128;x+=4){const y=Math.max(3,32-Math.floor(x/4));fill(x,y,4,2,'#80b7a6');fill(252-x,y,4,2,'#80b7a6');}
    fill(0,33,256,2,'#99cdb5');fill(0,64,256,4,'#5e9483');fill(0,68,256,2,'#b9d8a8');
    for(const [x,y] of [[35,21],[211,16]]){
      fill(x,11,1,y,ink);fill(x-8,y+9,17,3,ink);fill(x-5,y+12,12,4,'#b5796d');
      for(let i=0;i<5;i++){const xx=x-6+i*3;const len=[9,4,6,10,5][i];fill(xx,y+4,2,len,deep);fill(xx+1,y+3,4,3,leaf);fill(xx-1,y+6,3,2,lime);}
    }
    fill(4,81,84,4,ink);fill(6,85,80,2,'#bb987d');fill(9,86,3,14,ink);fill(79,86,3,14,ink);
    fern(22,68,9);pot(14,68,19,13);
    flower(54,56,'#e77c9a');flower(46,59,'#fb997f');flower(62,60,'#e77c9a');pot(43,67,22,14);
    fern(77,73,4);pot(71,72,13,9);
    fill(159,85,95,4,ink);fill(162,89,89,2,'#c79b81');fill(165,90,3,10,ink);fill(246,90,3,10,ink);
    fern(182,72,10);pot(173,71,19,14);fern(228,67,6);fern(234,72,5);pot(218,70,27,15);
    flower(202,62,'#ed91ae');pot(196,72,14,13);
    fill(92,93,64,6,ink);fill(94,91,60,4,'#e49a76');fill(94,90,60,2,'#785956');
    for(let i=0;i<Math.min(6,count);i++)flower(98+i*10,80-i%2*3,['#ef91b2','#ff936f','#b192db'][i%3]);
    if(!count){for(const x of [101,123,145]){fill(x,85,2,5,deep);fill(x-3,84,4,2,leaf);fill(x+2,83,3,2,lime);}}
  }
  const key='forma-sprout-session-v1:'+location.pathname;
  const durations=[15,25,45];
  function fresh(minutes=25,completed=0){return {minutes,completed,mode:'ready',remaining:minutes*60000,end:0};}
  function load(){
    try{
      const v=JSON.parse(sessionStorage.getItem(key));
      if(v && durations.includes(v.minutes) && ['ready','running','paused','done'].includes(v.mode) &&
        Number.isSafeInteger(v.completed) && v.completed>=0 && Number.isFinite(v.remaining) &&
        v.remaining>=0 && v.remaining<=v.minutes*60000 && Number.isSafeInteger(v.end) && (v.mode!=='running'||v.end>0))return v;
    }catch{}
    return fresh();
  }
  let state=load(), lastGarden=-1;
  function save(){try{sessionStorage.setItem(key,JSON.stringify(state))}catch{}}
  function remaining(){return state.mode==='running'?Math.max(0,Math.min(state.minutes*60000,state.end-Date.now())):state.remaining;}
  function render(){
    if(state.mode==='running' && !remaining()){
      state.mode='done';state.remaining=0;state.end=0;state.completed++;save();
      get('message').textContent='专注结束，窗台添了一朵花。';
    }
    const sec=Math.ceil(remaining()/1000), clock=get('clock');
    clock.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
    clock.dateTime='PT'+sec+'S';
    get('status').textContent={ready:'准备专注',running:'正在专注',paused:'已经暂停',done:'专注完成'}[state.mode];
    const toggle=get('toggle');toggle.dataset.running=String(state.mode==='running');
    toggle.lastElementChild.textContent={ready:'开始专注',running:'暂停专注',paused:'继续专注',done:'再来一段'}[state.mode];
    get('reset').disabled=state.mode==='ready';
    for(const button of document.querySelectorAll('[data-minutes]')){
      button.setAttribute('aria-pressed',String(Number(button.dataset.minutes)===state.minutes));
      button.disabled=state.mode==='running'||state.mode==='paused';
    }
    if(lastGarden!==state.completed){
      get('count').textContent=state.completed;get('beds').textContent=state.completed?'已栽 '+state.completed+' 朵':'尚未栽花';
      garden(state.completed);lastGarden=state.completed;
    }
  }
  for(const button of document.querySelectorAll('[data-minutes]')){
    button.addEventListener('click',()=>{state=fresh(Number(button.dataset.minutes),state.completed);save();render();});
  }
  get('toggle').addEventListener('click',()=>{
    render();
    if(state.mode==='running'){state.remaining=remaining();state.end=0;state.mode='paused';}
    else{if(state.mode==='done')state.remaining=state.minutes*60000;state.end=Date.now()+state.remaining;state.mode='running';}
    save();render();get('message').textContent=get('status').textContent;
  });
  get('reset').addEventListener('click',()=>{state=fresh(state.minutes,state.completed);save();render();get('message').textContent='计时已重置。';});
  render();setInterval(()=>{if(state.mode==='running')render()},300);document.addEventListener('visibilitychange',render);
})();
</script>
</body>
</html>
