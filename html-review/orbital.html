<body data-review-context="replay">
<main class="console">
<header class="mast"><div class="brand"><i class="brand-mark" aria-hidden="true"></i>凌日 <small>ORBITAL CONTROL</small></div><div class="archive"><b>回放</b><span>2026.11.07 / UTC+8</span></div></header>
<section class="top" aria-labelledby="hall-title"><h1 id="hall-title" data-review-id="orbital-title">轨道测控大厅</h1><div class="snapshots"><span>回放时刻</span><div class="steps" id="times" role="group" aria-label="回放时刻"></div></div></section>
<div class="layout"><div class="main-deck">
<section class="scene" aria-labelledby="view-title"><canvas id="globe" role="img"></canvas><div class="scene-top"><h2 id="view-title">轨道态势</h2><small>亚欧站网 · 正射投影</small></div><div class="map-key"><span><i class="space-dot"></i>航天器</span><span><i class="ground-dot"></i>地面站</span></div></section>
<section class="windows" aria-labelledby="windows-title"><div class="window-title"><h2 id="windows-title">过站窗口</h2><span class="caption">白线为回放时刻 · 仰角 ≥ 10°</span></div><div class="ticks" aria-hidden="true"><span></span><div id="ticks"></div></div><div id="bands" role="group" aria-label="按过站窗口选择航天器"></div></section></div>
<aside class="telemetry" aria-label="航天器遥测"><section class="detail"><div class="panel-label"><h2>目标遥测</h2><small id="station"></small></div><h3 class="craft-heading" id="target"><strong id="name"></strong><small id="callsign"></small></h3><p class="link-status" id="link"></p><div class="angle"><strong><b id="elevation"></b><small>°</small></strong><span>站心仰角</span></div><div class="profile"><canvas id="profile" role="img"></canvas></div><dl><div><dt>进入窗口</dt><dd id="enter"></dd></div><div><dt>离开窗口</dt><dd id="exit"></dd></div><div><dt>轨道高度</dt><dd id="height"></dd></div><div><dt>最高仰角</dt><dd id="peak"></dd></div></dl></section>
<section class="fleet"><div class="panel-label"><h2>跟踪目标</h2><small>3 星 / 3 站</small></div><div class="fleet-list" id="ships" role="group" aria-label="选择跟踪目标"></div></section></aside></div>

function xyz(lon,lat){const l=lon*rad,p=lat*rad;return [Math.cos(p)*Math.cos(l),Math.cos(p)*Math.sin(l),Math.sin(p)]}
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const combine=(a,b,t,u)=>a.map((v,i)=>v*t+b[i]*u);

for(const c of craft){

function position(c,t){const angle=(t-c.peak)*c.angleRate;return combine(c.near,c.along,Math.cos(angle),Math.sin(angle))}

function inside(x,y,p){let hit=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [a,b]=p[i],[c,d]=p[j];if((b>y)!==(d>y)&&x<(c-a)*(y-b)/(d-b)+a)hit=!hit}return hit}
const land=[];
for(let lat=-78;lat<=82;lat+=1.45){const step=1.48/Math.cos(lat*rad);for(let lon=-180;lon<180;lon+=step){const v=point(xyz(lon,lat));if(v[2]>.015&&continents.some(p=>inside(lon,lat,p)))land.push(v)}}
function surface(canvas){const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.round(rect.width),h=Math.round(rect.height);if(!w||!h)return null;if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);return {ctx,w,h}}
function drawGlobe(){
  const surfaceInfo=surface(get('globe'));if(!surfaceInfo)return;
  const {ctx,w,h}=surfaceInfo,small=w<550,r=Math.min(w*(small?.351:.34),h*(small?.360:.407)),cx=w*.489,cy=h*(small?.542:.511);
  const c=craft[chosen];
  function path(points,color,line=1,dash=[]){ctx.beginPath();let next=true;for(const v of points){if(!v){next=true;continue}const x=cx+v[0]*r,y=cy+v[1]*r;if(next)ctx.moveTo(x,y);else ctx.lineTo(x,y);next=false}ctx.strokeStyle=color;ctx.lineWidth=line;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
  function arc(radius,stroke,width=1){ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}
  let seed=246813;function rand(){seed=(seed*16807)%2147483647;return seed/2147483647}
  for(let i=0;i<111;i++){const x=rand()*w,y=rand()*h,a=rand();ctx.fillStyle='rgba(157,196,219,'+(.1+a*.37)+')';ctx.fillRect(x,y,a>.88?1.75:1,a>.88?1.75:1)}
  const glow=ctx.createRadialGradient(cx,cy,r*.94,cx,cy,r*1.18);glow.addColorStop(0,'rgba(66,178,185,.2)');glow.addColorStop(.35,'rgba(42,151,171,.09)');glow.addColorStop(1,'rgba(20,90,120,0)');ctx.fillStyle=glow;ctx.fillRect(cx-r*1.2,cy-r*1.2,r*2.4,r*2.4);
  const ocean=ctx.createRadialGradient(cx-r*.32,cy-r*.47,r*.07,cx+r*.28,cy+r*.31,r*1.32);ocean.addColorStop(0,'#244755');ocean.addColorStop(.55,'#122e3e');ocean.addColorStop(1,'#07121f');ctx.fillStyle=ocean;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  for(let lat=-75;lat<=75;lat+=15){const pts=[];for(let l=-180;l<=180;l+=2){const v=point(xyz(l,lat));pts.push(v[2]>=0?v:null)}path(pts,lat===0?'#365968':'#294655',lat===0?1.05:.7)}
  for(let lon=-180;lon<180;lon+=15){const pts=[];for(let l=-90;l<=90;l+=2){const v=point(xyz(lon,l));pts.push(v[2]>=0?v:null)}path(pts,'#294655',.65)}
  const dotR=Math.max(.62,r*.0054);
  for(const v of land){const light=Math.max(0,(-v[0]*.37-v[1]*.49+v[2]*.49));ctx.fillStyle='rgba(140,202,200,'+(.34+.55*light)+')';ctx.beginPath();ctx.ellipse(cx+v[0]*r,cy+v[1]*r,dotR*(.45+.55*v[2]),dotR,0,0,Math.PI*2);ctx.fill()}
  arc(r,'#65a5ad',1.1);arc(r+2,'#467a83',.8);
  // The apparent limb also occludes the back side of each real-radius orbital path.
  const screenPositions=[];
  for(const i of [...craft.keys()].sort((a,b)=>Number(a===chosen)-Number(b===chosen))){
    const item=craft[i],height=1+item.alt/earth,pts=[];
    for(let j=0;j<=480;j++){const t=item.peak+(j/480*2-1)*Math.PI/item.angleRate;const v=point(position(item,t)).map(n=>n*height);pts.push(v[2]<0&&v[0]*v[0]+v[1]*v[1]<1?null:v)}
    path(pts,item.color,i===chosen?1.85:1.03,i===chosen?[]:[4,5]);
    const v=point(position(item,minute)).map(n=>n*height),s=point(item.ground);
    if(i===chosen&&state(item).key==='active')path([s,v],'#d5f8e9',1.2,[3,3]);
    ctx.strokeStyle=i===chosen?'#f8fbf5':'#97b1be';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(cx+s[0]*r,cy+s[1]*r,i===chosen?4.2:2.8,0,Math.PI*2);ctx.stroke();
    if(v[2]>=0||v[0]*v[0]+v[1]*v[1]>=1)screenPositions.push({i,x:cx+v[0]*r,y:cy+v[1]*r});
  }
  for(const p of screenPositions){const selected=p.i===chosen;ctx.fillStyle=craft[p.i].color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);ctx.fillRect(selected?-4:-3,selected?-4:-3,selected?8:6,selected?8:6);if(selected){ctx.lineWidth=1;ctx.strokeStyle='#f1f8f5';ctx.strokeRect(-8,-8,16,16)}ctx.restore()}
  const selected=screenPositions.find(p=>p.i===chosen);
  if(selected){const dir=selected.x<cx?-1:1;const endX=selected.x+dir*r*.33,endY=selected.y-r*.26;ctx.beginPath();ctx.moveTo(selected.x+dir*9,selected.y-6);ctx.lineTo(selected.x+dir*r*.16,endY);ctx.lineTo(endX,endY);ctx.strokeStyle='#88ead3';ctx.lineWidth=1;ctx.stroke();
    ctx.font='600 '+(small?11:Math.max(13,Math.round(r*.059)))+'px Consolas, monospace';const label=craft[chosen].id;const tw=ctx.measureText(label).width;const lx=dir>0?endX+4:endX-tw-4;ctx.fillStyle='#0b1e28';ctx.fillRect(lx-2,endY-11,tw+4,18);ctx.fillStyle='#a9ffe7';ctx.fillText(label,lx,endY+4)}
  if(!small){ctx.font='12px Consolas, monospace';ctx.fillStyle='#8faab6';ctx.textAlign='center';ctx.fillText('N',cx,cy-r-17);ctx.textAlign='left';ctx.fillStyle='#8faab6';ctx.fillText('85° E / 33° N',w-116,h-17)}
}
function drawProfile(){
  const info=surface(get('profile'));if(!info)return;const {ctx,w,h}=info,c=craft[chosen];const top=7,bottom=h-18,left=30,right=w-4;const x=t=>left+(t-start)/(end-start)*(right-left);const y=e=>bottom-(e+65)/155*(bottom-top);
  const boundary=y(threshold);ctx.strokeStyle='#496273';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(left,boundary);ctx.lineTo(right,boundary);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();let i=0;for(let t=start;t<=end+.001;t+=.125){const a=x(t),b=y(elevation(c,t));if(i++===0)ctx.moveTo(a,b);else ctx.lineTo(a,b)}
  ctx.strokeStyle='#78e7d0';ctx.lineWidth=2;ctx.stroke();ctx.lineTo(right,bottom);ctx.lineTo(left,bottom);ctx.closePath();const fill=ctx.createLinearGradient(0,top,0,bottom);fill.addColorStop(0,'rgba(118,238,209,.29)');fill.addColorStop(1,'rgba(118,238,209,.03)');ctx.fillStyle=fill;ctx.fill();
  const a=x(minute),b=y(elevation(c,minute));ctx.strokeStyle='#b2c7cd';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a,top);ctx.lineTo(a,bottom);ctx.stroke();ctx.beginPath();ctx.arc(a,b,3.7,0,Math.PI*2);ctx.fillStyle='#c4fff0';ctx.fill();ctx.font='11px Consolas, monospace';ctx.fillStyle='#a9bac5';ctx.textAlign='left';ctx.fillText('10°',0,boundary+3);ctx.fillText(time(start,false),left,h-3);ctx.textAlign='right';ctx.fillText(time(end,false),right,h-3);ctx.textAlign='left';
}
function update(announce){
  const c=craft[chosen],phase=state(c);get('name').textContent=c.name;get('callsign').textContent=c.id;get('station').textContent=c.station;get('elevation').textContent=elevation(c,minute).toFixed(1);get('enter').textContent=time(c.open);get('exit').textContent=time(c.close);get('peak').textContent=elevation(c,c.peak).toFixed(1)+'°';get('height').textContent=c.alt+' km';get('link').textContent=phase.label+' · '+phase.line;get('link').dataset.state=phase.key;
  get('clock').textContent='站网快照 '+time(minute);document.body.dataset.reviewObject=c.id+'-'+minute;
  for(const id of ['target','name','callsign','station','elevation','enter','exit','peak','height','link','globe','profile'])get(id).dataset.reviewId='orbital-'+id+'-'+c.id+'-'+minute;
  for(const id of ['station','elevation','enter','exit','peak','height']){
    get(id).closest('div').dataset.reviewId='orbital-reading-'+id+'-'+c.id+'-'+minute;
  }
  get('globe').setAttribute('aria-label',time(minute)+' 卫星与站网示意，当前目标 '+c.name+'，'+c.station+' '+phase.label);get('profile').setAttribute('aria-label',c.name+' 站心仰角随时间变化，最高 '+get('peak').textContent+'，过站窗口 '+time(c.open)+' 至 '+time(c.close));
  timeButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(moments[i]===minute)));
  craft.forEach((item,i)=>{shipButtons[i].setAttribute('aria-pressed',String(i===chosen));shipButtons[i].querySelector('small').textContent=state(item).label;windowButtons[i].setAttribute('aria-pressed',String(i===chosen));windowButtons[i].querySelector('.now').style.left=percent(minute)+'%'});
  drawGlobe();drawProfile();if(announce)get('announce').textContent=time(minute)+'，'+c.name+'，'+phase.label+'，仰角 '+get('elevation').textContent+' 度';
}
new ResizeObserver(()=>{drawGlobe();drawProfile()}).observe(document.querySelector('.scene'));
new ResizeObserver(drawProfile).observe(get('profile'));
update(false);
